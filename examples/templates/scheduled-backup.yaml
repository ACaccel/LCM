# Scenario 3: run a service's backup on a schedule and confirm it.
#
# trigger.cron -> lifecycle.backup (retried with backoff) -> optional wait
# for a heartbeat check to report in after the backup started; a failed
# backup or a missing heartbeat is notified. Make the backup command post
# to /api/v1/heartbeats/<service>/<check> with an ingest token when it is
# done.
#
# The trigger takes its values when the template is instantiated; every
# other node reads params.*.
apiVersion: lcm/v1
kind: Policy
metadata:
  name: scheduled-backup
spec:
  params:
    service: my-service
    schedule: "0 3 * * *"
    timezone: Asia/Taipei
    heartbeatCheck: ""
    heartbeatTimeout: 30m
    notifySecret: ""
  nodes:
    - id: tick
      type: trigger.cron
      props:
        schedule: "{{ params.schedule }}"
        timezone: "{{ params.timezone }}"
        catchUp: once
      next: { out: [backup] }

    - id: backup
      type: lifecycle.backup
      props: { service: "{{ params.service }}" }
      retry: { max: 3, backoff: 1m, maxBackoff: 10m }
      next: { out: [confirm_gate], error: [backup_failed] }

    - id: confirm_gate
      type: flow.if
      props: { condition: 'params.heartbeatCheck != ""' }
      next: { true: [heartbeat] }
    - id: heartbeat
      type: wait.until
      props:
        interval: 1m
        timeout: "{{ params.heartbeatTimeout }}"
        condition: 'inputs.svc.checks[inputs.check]?.status == "up" && inputs.svc.checks[inputs.check].lastResultMs > inputs.since'
        inputs:
          svc: "{{ service[params.service] }}"
          check: "{{ params.heartbeatCheck }}"
          since: "{{ nodes.backup.startedMs }}"
      next: { timeout: [heartbeat_missing] }

    - id: backup_failed
      type: notify
      props:
        target: discord
        optional: true
        urlSecret: "{{ params.notifySecret }}"
        title: "{{ params.service }} backup"
        message: "The backup failed: {{ nodes.backup.message }}"
    - id: heartbeat_missing
      type: notify
      props:
        target: discord
        optional: true
        urlSecret: "{{ params.notifySecret }}"
        title: "{{ params.service }} backup"
        message: "The backup ran but the {{ params.heartbeatCheck }} heartbeat did not arrive in time."
