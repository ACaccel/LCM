# Scenario 1: deploy every new commit of a branch once CI is green.
#
# trigger.git -> (CI check) -> deploy window -> (lifecycle.backup) ->
# lifecycle.deploy -> wait for health -> notify; an unhealthy or failed deploy
# rolls back, except a deploy that reports deploy.needsUpgrade (the candidate
# needs an action by the operator and nothing was changed): that is announced
# and not rolled back. With backupBeforeDeploy the service's backup runs
# first; when it fails nothing is deployed or rolled back, and that is
# announced.
# One message per deployment, on Discord (notifySecret) or a BotFleet konata
# relay (notifyTarget: konata, notifyUrl, notifyTokenSecret), is created at
# the start and edited as the stages finish.
#
# The trigger takes its values when the template is instantiated (trigger
# props cannot be expressions); every other node reads params.* and can be
# changed by editing spec.params.
apiVersion: lcm/v2
kind: Policy
metadata:
  name: auto-deploy
spec:
  params:
    resource: my-service
    repo: https://github.com/owner/my-service.git
    branch: main
    requireCI: true
    ciRepo: owner/my-service
    ciWorkflows: []
    ciTokenSecret: ""
    ciWait: 30m
    windows:
      - { start: "00:00", end: "24:00" }
    timezone: Asia/Taipei
    healthTimeout: 5m
    backupBeforeDeploy: false
    notifyTarget: discord
    notifySecret: ""
    notifyUrl: ""
    notifyTokenSecret: ""
  nodes:
    - id: push
      type: trigger.git
      props:
        repo: "{{ params.repo }}"
        branch: "{{ params.branch }}"
      next: { out: [fresh] }

    # Forget the previous run's Discord message so each deployment gets its
    # own; konata messages are per run anyway.
    - id: fresh
      type: state.set
      props: { key: deploy-message, value: {} }
      next: { out: [announce] }
    - id: announce
      type: notify
      props:
        target: "{{ params.notifyTarget }}"
        optional: true
        urlSecret: "{{ params.notifySecret }}"
        url: "{{ params.notifyUrl }}"
        tokenSecret: "{{ params.notifyTokenSecret }}"
        stateKey: deploy-message
        title: "{{ params.resource }} {{ trigger.commit[:7] }}"
        message: "{{ params.requireCI ? 'Commit ' + trigger.commit[:7] + ' pushed. Checking CI.' : 'Commit ' + trigger.commit[:7] + ' pushed.' }}"
        status: running
        link: "{{ params.ciRepo == '' ? '' : 'https://github.com/' + params.ciRepo + '/commit/' + trigger.commit }}"
        stages:
          - { label: CI, state: "{{ params.requireCI ? 'running' : 'skipped' }}" }
          - { label: Deploy window, state: pending }
          - { label: Build and install, state: pending }
          - { label: Health check, state: pending }
      next: { out: [ci_gate], error: [ci_gate] }

    - id: ci_gate
      type: flow.if
      props: { condition: params.requireCI }
      next: { true: [ci], false: [window] }
    - id: ci
      type: ci.status
      props:
        repo: "{{ params.ciRepo }}"
        commit: "{{ trigger.commit }}"
        workflows: "{{ params.ciWorkflows }}"
        tokenSecret: "{{ params.ciTokenSecret }}"
        waitFor: "{{ params.ciWait }}"
      next: { success: [window], failure: [ci_failed], pending: [ci_failed] }

    - id: window
      type: guard.window
      props:
        windows: "{{ params.windows }}"
        timezone: "{{ params.timezone }}"
        wait: true
      next: { out: [deploying], blocked: [blocked] }
    - id: deploying
      type: notify
      props:
        target: "{{ params.notifyTarget }}"
        optional: true
        urlSecret: "{{ params.notifySecret }}"
        url: "{{ params.notifyUrl }}"
        tokenSecret: "{{ params.notifyTokenSecret }}"
        stateKey: deploy-message
        title: "{{ params.resource }} {{ trigger.commit[:7] }}"
        message: "Deploying {{ trigger.commit[:7] }}."
        status: running
        link: "{{ params.ciRepo == '' ? '' : 'https://github.com/' + params.ciRepo + '/commit/' + trigger.commit }}"
        stages:
          - { label: CI, state: "{{ params.requireCI ? 'done' : 'skipped' }}" }
          - { label: Deploy window, state: done }
          - { label: Build and install, state: running }
          - { label: Health check, state: pending }
      next: { out: [backup_gate], error: [backup_gate] }

    - id: backup_gate
      type: flow.if
      props: { condition: params.backupBeforeDeploy }
      next: { true: [backup], false: [deploy] }
    - id: backup
      type: lifecycle.backup
      props: { resource: "{{ params.resource }}" }
      next: { out: [deploy], error: [backup_failed] }

    - id: deploy
      type: lifecycle.deploy
      props:
        resource: "{{ params.resource }}"
        version: "{{ trigger.commit }}"
      next: { out: [verifying], error: [deploy_failed] }
    # A rollback redeploys the version that already runs, so it is pointless
    # when the deploy refused to change anything.
    - id: deploy_failed
      type: flow.if
      props: { condition: 'nodes.deploy.message contains "deploy.needsUpgrade"' }
      next: { true: [needs_upgrade], false: [rolling_back] }
    - id: verifying
      type: notify
      props:
        target: "{{ params.notifyTarget }}"
        optional: true
        urlSecret: "{{ params.notifySecret }}"
        url: "{{ params.notifyUrl }}"
        tokenSecret: "{{ params.notifyTokenSecret }}"
        stateKey: deploy-message
        title: "{{ params.resource }} {{ trigger.commit[:7] }}"
        message: "Deployed {{ trigger.commit[:7] }}. Waiting for the service to become healthy."
        status: running
        link: "{{ params.ciRepo == '' ? '' : 'https://github.com/' + params.ciRepo + '/commit/' + trigger.commit }}"
        stages:
          - { label: CI, state: "{{ params.requireCI ? 'done' : 'skipped' }}" }
          - { label: Deploy window, state: done }
          - { label: Build and install, state: done }
          - { label: Health check, state: running }
      next: { out: [healthy], error: [healthy] }

    - id: healthy
      type: wait.until
      props:
        interval: 10s
        timeout: "{{ params.healthTimeout }}"
        condition: 'inputs.svc.health == "healthy" && all(values(inputs.svc.checks), {!.critical || .lastResultMs > inputs.since})'
        inputs:
          svc: "{{ resource[params.resource] }}"
          since: "{{ nodes.deploy.startedMs + nodes.deploy.durationMs }}"
      next: { out: [done], timeout: [rolling_back] }

    # Reached from a failed deploy or a health timeout; a failed deploy's
    # output is the error, which has a message.
    - id: rolling_back
      type: notify
      props:
        target: "{{ params.notifyTarget }}"
        optional: true
        urlSecret: "{{ params.notifySecret }}"
        url: "{{ params.notifyUrl }}"
        tokenSecret: "{{ params.notifyTokenSecret }}"
        stateKey: deploy-message
        title: "{{ params.resource }} {{ trigger.commit[:7] }}"
        message: "{{ 'message' in nodes.deploy ? 'Deploying ' + trigger.commit[:7] + ' failed.' : 'The service did not become healthy within ' + params.healthTimeout + '.' }} Rolling back."
        status: running
        link: "{{ params.ciRepo == '' ? '' : 'https://github.com/' + params.ciRepo + '/commit/' + trigger.commit }}"
        stages:
          - { label: CI, state: "{{ params.requireCI ? 'done' : 'skipped' }}" }
          - { label: Deploy window, state: done }
          - { label: Build and install, state: "{{ 'message' in nodes.deploy ? 'failed' : 'done' }}" }
          - { label: Health check, state: "{{ 'message' in nodes.deploy ? 'skipped' : 'failed' }}" }
          - { label: Rollback, state: running }
      next: { out: [rollback], error: [rollback] }

    - id: rollback
      type: lifecycle.rollback
      props: { resource: "{{ params.resource }}" }
      next: { out: [rolled_back], error: [rollback_failed] }

    - id: done
      type: notify
      props:
        target: "{{ params.notifyTarget }}"
        optional: true
        urlSecret: "{{ params.notifySecret }}"
        url: "{{ params.notifyUrl }}"
        tokenSecret: "{{ params.notifyTokenSecret }}"
        stateKey: deploy-message
        title: "{{ params.resource }} {{ trigger.commit[:7] }}"
        message: "Deployed {{ trigger.commit[:7] }} and the service is healthy."
        status: succeeded
        link: "{{ params.ciRepo == '' ? '' : 'https://github.com/' + params.ciRepo + '/commit/' + trigger.commit }}"
        stages:
          - { label: CI, state: "{{ params.requireCI ? 'done' : 'skipped' }}" }
          - { label: Deploy window, state: done }
          - { label: Build and install, state: done }
          - { label: Health check, state: done }
    - id: rolled_back
      type: notify
      props:
        target: "{{ params.notifyTarget }}"
        optional: true
        urlSecret: "{{ params.notifySecret }}"
        url: "{{ params.notifyUrl }}"
        tokenSecret: "{{ params.notifyTokenSecret }}"
        stateKey: deploy-message
        title: "{{ params.resource }} {{ trigger.commit[:7] }}"
        message: "{{ 'message' in nodes.deploy ? 'Deploying ' + trigger.commit[:7] + ' failed.' : 'The service did not become healthy within ' + params.healthTimeout + '.' }} Rolled back to the previous version."
        status: failed
        link: "{{ params.ciRepo == '' ? '' : 'https://github.com/' + params.ciRepo + '/commit/' + trigger.commit }}"
        stages:
          - { label: CI, state: "{{ params.requireCI ? 'done' : 'skipped' }}" }
          - { label: Deploy window, state: done }
          - { label: Build and install, state: "{{ 'message' in nodes.deploy ? 'failed' : 'done' }}" }
          - { label: Health check, state: "{{ 'message' in nodes.deploy ? 'skipped' : 'failed' }}" }
          - { label: Rollback, state: done }
    - id: rollback_failed
      type: notify
      props:
        target: "{{ params.notifyTarget }}"
        optional: true
        urlSecret: "{{ params.notifySecret }}"
        url: "{{ params.notifyUrl }}"
        tokenSecret: "{{ params.notifyTokenSecret }}"
        stateKey: deploy-message
        title: "{{ params.resource }} {{ trigger.commit[:7] }}"
        message: "{{ 'message' in nodes.deploy ? 'Deploying ' + trigger.commit[:7] + ' failed.' : 'The service did not become healthy within ' + params.healthTimeout + '.' }} The rollback failed too. Manual action needed."
        status: failed
        link: "{{ params.ciRepo == '' ? '' : 'https://github.com/' + params.ciRepo + '/commit/' + trigger.commit }}"
        stages:
          - { label: CI, state: "{{ params.requireCI ? 'done' : 'skipped' }}" }
          - { label: Deploy window, state: done }
          - { label: Build and install, state: "{{ 'message' in nodes.deploy ? 'failed' : 'done' }}" }
          - { label: Health check, state: "{{ 'message' in nodes.deploy ? 'skipped' : 'failed' }}" }
          - { label: Rollback, state: failed }
    - id: ci_failed
      type: notify
      props:
        target: "{{ params.notifyTarget }}"
        optional: true
        urlSecret: "{{ params.notifySecret }}"
        url: "{{ params.notifyUrl }}"
        tokenSecret: "{{ params.notifyTokenSecret }}"
        stateKey: deploy-message
        title: "{{ params.resource }} {{ trigger.commit[:7] }}"
        message: "CI for {{ trigger.commit[:7] }} did not pass. Not deployed."
        status: failed
        link: "{{ params.ciRepo == '' ? '' : 'https://github.com/' + params.ciRepo + '/commit/' + trigger.commit }}"
        stages:
          - { label: CI, state: failed }
          - { label: Deploy window, state: skipped }
          - { label: Build and install, state: skipped }
          - { label: Health check, state: skipped }
    - id: blocked
      type: notify
      props:
        target: "{{ params.notifyTarget }}"
        optional: true
        urlSecret: "{{ params.notifySecret }}"
        url: "{{ params.notifyUrl }}"
        tokenSecret: "{{ params.notifyTokenSecret }}"
        stateKey: deploy-message
        title: "{{ params.resource }} {{ trigger.commit[:7] }}"
        message: "{{ trigger.commit[:7] }} is outside the deploy window. Not deployed."
        status: cancelled
        link: "{{ params.ciRepo == '' ? '' : 'https://github.com/' + params.ciRepo + '/commit/' + trigger.commit }}"
        stages:
          - { label: CI, state: "{{ params.requireCI ? 'done' : 'skipped' }}" }
          - { label: Deploy window, state: failed }
          - { label: Build and install, state: skipped }
          - { label: Health check, state: skipped }
    - id: backup_failed
      type: notify
      props:
        target: "{{ params.notifyTarget }}"
        optional: true
        urlSecret: "{{ params.notifySecret }}"
        url: "{{ params.notifyUrl }}"
        tokenSecret: "{{ params.notifyTokenSecret }}"
        stateKey: deploy-message
        title: "{{ params.resource }} {{ trigger.commit[:7] }}"
        message: "The backup before deploying {{ trigger.commit[:7] }} failed, so it was not deployed; the running version is unchanged. {{ nodes.backup.message }}"
        status: failed
        link: "{{ params.ciRepo == '' ? '' : 'https://github.com/' + params.ciRepo + '/commit/' + trigger.commit }}"
        stages:
          - { label: CI, state: "{{ params.requireCI ? 'done' : 'skipped' }}" }
          - { label: Deploy window, state: done }
          - { label: Build and install, state: skipped }
          - { label: Health check, state: skipped }
    - id: needs_upgrade
      type: notify
      props:
        target: "{{ params.notifyTarget }}"
        optional: true
        urlSecret: "{{ params.notifySecret }}"
        url: "{{ params.notifyUrl }}"
        tokenSecret: "{{ params.notifyTokenSecret }}"
        stateKey: deploy-message
        title: "{{ params.resource }} {{ trigger.commit[:7] }}"
        message: "{{ trigger.commit[:7] }} needs an operator action and was not installed; the running version is unchanged. {{ nodes.deploy.message }}"
        status: failed
        link: "{{ params.ciRepo == '' ? '' : 'https://github.com/' + params.ciRepo + '/commit/' + trigger.commit }}"
        stages:
          - { label: CI, state: "{{ params.requireCI ? 'done' : 'skipped' }}" }
          - { label: Deploy window, state: done }
          - { label: Build and install, state: failed }
          - { label: Health check, state: skipped }
