                $ref: '#/components/schemas/SecurityHostOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityHostApplyRequest'
  /security/host/operations:
    get:
      tags:
      - Monitoring
      operationId: listSecurityHostOperations
      summary: listSecurityHostOperations
      description: Admin-only. Ingest tokens cannot read or manage this resource.
      responses:
        '200':
          description: Successful bounded response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHostOperations'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /security/host/operations/{id}:
    get:
      tags:
      - Monitoring
      operationId: getSecurityHostOperation
      summary: getSecurityHostOperation
      description: Admin-only. Ingest tokens cannot read or manage this resource.
      responses:
        '200':
          description: Successful bounded response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityHostOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

  /security/settings/history:
    get:
      tags:
      - Monitoring
      operationId: getSecuritySettingsHistory
      summary: Read the last hundred effective notification settings versions
      description: Admin-only. Ingest tokens cannot read or manage this resource.
      responses:
        '200':
          description: Durable change history.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecuritySettingsHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /heartbeats/{resource}/{check}:
    parameters:
      - $ref: "#/components/parameters/Resource"
      - name: check
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Ingest]
      operationId: postHeartbeat
      summary: Report a heartbeat
      description: The body, if any, is kept as a short message. Allowed for `admin` and `ingest` tokens.
      requestBody:
        required: false
        content:
          "*/*":
            schema: { type: string }
      responses:
        "202": { $ref: "#/components/responses/HeartbeatAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    get:
      tags: [Ingest]
      operationId: getHeartbeat
      summary: Report a heartbeat without a body
      description: For senders that can only issue GET, such as `curl` in a cron line.
      responses:
        "202": { $ref: "#/components/responses/HeartbeatAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API token (`lcm_...`), created with `lcm token create` or `POST /tokens`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: lcm_session
    signature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: Hex HMAC-SHA256 of the body, optionally prefixed `sha256=`.

  headers:
    ETag:
      description: The document version, quoted.
      schema: { type: string }

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` of the previous page.
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The version the change is based on, or `*` to create.
      schema: { type: string }
    Resource:
      name: resource
      in: path
      required: true
      description: Name of an active resource, or `@<id>` for any incarnation including archives.
      schema: { type: string }
    Policy:
      name: p
      in: path
      required: true
      schema: { type: string }
    Module:
      name: m
      in: path
      required: true
      schema: { type: string }
    SourceName:
      name: name
      in: path
      required: true
      schema: { type: string }
    OwnedKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [resource, policy, module] }
    OwnedName:
      name: name
      in: path
      required: true
      schema: { type: string }
    Version:
      name: v
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RunID:
      name: id
      in: path
      required: true
      schema: { type: string }
    TimelineKinds:
      name: kinds
      in: query
      description: Entry kinds to keep, repeated or comma separated.
      schema: { type: array, items: { type: string } }
      style: form
      explode: true
    TimelineFrom:
      name: from
      in: query
      description: Entries at or after this time.
      schema: { type: string, format: date-time }
    TimelineTo:
      name: to
      in: query
      description: Entries before this time.
      schema: { type: string, format: date-time }

  requestBodies:
    ResourceDocument:
      required: true
      content:
        application/yaml:
          schema: { type: string }
        application/json:
          schema: { $ref: "#/components/schemas/ResourceDocument" }
    PolicyDocument:
      required: true
      content:
        application/yaml:
          schema: { type: string }
        application/json:
          schema: { $ref: "#/components/schemas/PolicyDocument" }
    ModuleDocument:
      required: true
      content:
        application/yaml:
          schema: { type: string }
        application/json:
          schema: { $ref: "#/components/schemas/ModuleDocument" }

  responses:
    Internal:
      description: Internal server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: Component disabled, capacity exceeded or shutting down.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Not authenticated.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Authenticated but not allowed, for example a token scope that does not permit the endpoint.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: |
        Conflict. `error.code` tells which: `version_conflict` (details carry
        `currentVersion`), `already_exists`, `lock_held`, `invalid_state`,
        `precondition_failed`, `impact_unacknowledged` (details carry `resource`,
        `action` and `impact`, a `ResourceImpact`) or `conflict`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TooLarge:
      description: The request body exceeds the limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unprocessable:
      description: Validation failed; `error.details.issues` locates the problems.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationErrorEnvelope" }
    TooManyRequests:
      description: Too many failed attempts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    HeartbeatAccepted:
      description: Recorded.
      content:
        application/json:
          schema:
            type: object
            required: [accepted]
            properties:
              accepted: { type: boolean }

  schemas:
    SecuritySettingsHistory:
      type: object
      required:
      - version
      - actor
      - at
      - reason
      - notificationsEnabled
      - cooldownSeconds
      - minimumSeverity
      additionalProperties: false
      properties:
        version:
          type: integer
        actor:
          type: string
        at:
          type: string
          format: date-time
        reason:
          type: string
        notificationsEnabled:
          type: boolean
        cooldownSeconds:
          type: integer
        minimumSeverity:
          type: string
          enum:
          - info
          - warning
          - critical
    SecurityHandling:
      type: object
      additionalProperties: false
      required:
      - version
      - acknowledged
      - note
      - silenceUntil
      - updatedAt
      - updatedBy
      properties:
        version:
          type: integer
        acknowledged:
          type: boolean
        note:
          type: string
        silenceUntil:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedBy:
          type: string
    SecurityHandlingHistory:
      type: object
      additionalProperties: false
      required:
      - id
      - action
      - reason
      - actor
      - at
      - silenceUntil
      properties:
        id:
          type: integer
        action:
          type: string
        reason:
          type: string
        actor:
          type: string
        at:
          type: string
          format: date-time
        silenceUntil:
          type:
          - string
          - 'null'
          format: date-time
    SecurityHandlingUpdate:
      type: object
      additionalProperties: false
      required:
      - action
      - reason
      properties:
        action:
          type: string
          enum:
          - acknowledge
          - note
          - silence
          - unsilence
        reason:
          type: string
          minLength: 1
          maxLength: 500
        silenceUntil:
          type: string
          format: date-time
    SecurityIncidentDetail:
      type: object
      additionalProperties: false
      required:
      - incident
      - history
      properties:
        incident:
          $ref: '#/components/schemas/SecurityIncident'
        history:
          type: array
          items:
            $ref: '#/components/schemas/SecurityHandlingHistory'
    SecuritySettings:
      type: object
      additionalProperties: false
      required:
      - version
      - notificationsEnabled
      - cooldownSeconds
      - minimumSeverity
      - rootEnabled
      - notificationConfigured
      - maxSilenceSeconds
      properties:
        version:
          type: integer
        notificationsEnabled:
          type: boolean
        cooldownSeconds:
          type: integer
        minimumSeverity:
          type: string
          enum:
          - info
          - warning
          - critical
        rootEnabled:
          type: boolean
        notificationConfigured:
          type: boolean
        maxSilenceSeconds:
          type: integer
    SecuritySettingsUpdate:
      type: object
      additionalProperties: false
      required:
      - notificationsEnabled
      - cooldownSeconds
      - minimumSeverity
      - reason
      properties:
        notificationsEnabled:
          type: boolean
        cooldownSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        minimumSeverity:
          type: string
          enum:
          - info
          - warning
          - critical
        reason:
          type: string
          minLength: 1
          maxLength: 500
    SecurityNotificationTest:
      type: object
      additionalProperties: false
      required:
      - requestId
      - incidentId
      - state
      - pending
      properties:
        requestId:
          type: string
        incidentId:
          type: string
        state:
          type: string
        pending:
          type: boolean
    SecurityTestRequest:
      type: object
      additionalProperties: false
      required:
      - requestId
      - reason
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        reason:
          type: string
          minLength: 1
          maxLength: 500
    SecuritySeriesPoint:
      type: object
      additionalProperties: false
      required:
      - windowStart
      - windowEnd
      - requests
      - status429
      - status5xx
      - dryRunHits
      - requestBytes
      - responseBytes
      - observedWindows
      - requestTimeSumMs
      - requestTimeMaxMs
      - averageMs
      - requestsPerSecond
      - observedSeconds
      properties:
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        requests:
          type: integer
        status429:
          type: integer
        status5xx:
          type: integer
        dryRunHits:
          type: integer
        requestBytes:
          type: integer
        responseBytes:
          type: integer
        observedWindows:
          type: integer
        requestTimeSumMs:
          type: number
        requestTimeMaxMs:
          type: number
        averageMs:
          type: number
        requestsPerSecond:
          type: number
        observedSeconds:
          type: number
    SecuritySeries:
      type: object
      additionalProperties: false
      required:
      - items
      - from
      - to
      - bucketSeconds
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SecuritySeriesPoint'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        bucketSeconds:
          type: integer
    SecurityHostProfile:
      type: object
      additionalProperties: false
      required:
      - name
      - enabled
      - required
      properties:
        name:
          type: string
        enabled:
          type: boolean
        required:
          type: boolean
    SecurityHostLimit:
      type: object
      additionalProperties: false
      required:
      - category
      - rate
      - burst
      - connections
      properties:
        category:
          type: string
          enum:
          - auth
          - api
          - upload
          - socket
          - static
          - other
        rate:
          type: string
        burst:
          type: integer
        connections:
          type: integer
    SecurityHostSchedule:
      type: object
      additionalProperties: false
      required:
      - hour
      - minute
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
    SecurityHostStatus:
      type: object
      additionalProperties: false
      required:
      - configured
      - available
      - reason
      - machineId
      - effectiveDigest
      - capabilities
      - aide
      - audit
      - nginx
      - collector
      properties:
        configured:
          type: boolean
          description: False when this LCM has no security host Machine (LCM_SECURITY_MACHINE_ID); every capability is then disabled and nothing changes until the configuration does, so clients need not poll.
        available:
          type: boolean
        reason:
          type: string
        machineId:
          type: string
        effectiveDigest:
          type: string
        capabilities:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - action
            - enabled
            - reason
            properties:
              action:
                type: string
                enum:
                - aide.check
                - aide.schedule
                - nginx.configure
                - audit.profile
                - aide.profile
                - baseline.request
              enabled:
                type: boolean
              reason:
                type: string
        aide:
          type: object
          additionalProperties: false
          required:
          - result
          - lastRunAt
          - nextRunAt
          - baselineCreatedAt
          - baselineDigest
          - schedule
          - profiles
          - reportSummary
          - targets
          properties:
            result:
              type:
              - string
              - 'null'
            lastRunAt:
              type:
              - string
              - 'null'
              format: date-time
            nextRunAt:
              type:
              - string
              - 'null'
              format: date-time
            baselineCreatedAt:
              type:
              - string
              - 'null'
              format: date-time
            baselineDigest:
              type:
              - string
              - 'null'
            schedule:
              oneOf:
              - $ref: '#/components/schemas/SecurityHostSchedule'
              - type: 'null'
            profiles:
              type: array
              items:
                $ref: '#/components/schemas/SecurityHostProfile'
            targets:
              type: [array, 'null']
              maxItems: 256
              items: {type: string, maxLength: 500}
            reportSummary:
              type:
              - string
              - 'null'
        audit:
          type: object
          additionalProperties: false
          required:
          - enabled
          - lost
          - backlog
          - rulesLoaded
          - profiles
          properties:
            enabled:
              type:
              - integer
              - 'null'
            lost:
              type:
              - integer
              - 'null'
            backlog:
              type:
              - integer
              - 'null'
            rulesLoaded:
              type:
              - boolean
              - 'null'
            profiles:
              type: array
              items:
                $ref: '#/components/schemas/SecurityHostProfile'
        nginx:
          type: object
          additionalProperties: false
          required:
          - mode
          - dryRunOnly
          - r11Approved
          - limits
          properties:
            mode:
              type:
              - string
              - 'null'
            dryRunOnly:
              type: boolean
            r11Approved:
              type: boolean
            limits:
              type: array
              items:
                $ref: '#/components/schemas/SecurityHostLimit'
        collector:
          type: object
          additionalProperties: false
          required:
          - observedAt
          - lastDelivery
          - queued
          - dropped
          - deliveryError
          - health
          properties:
            observedAt:
              type:
              - string
              - 'null'
              format: date-time
            lastDelivery:
              type:
              - string
              - 'null'
              format: date-time
            queued:
              type:
              - integer
              - 'null'
            dropped:
              type:
              - integer
              - 'null'
            deliveryError:
              type:
              - string
              - 'null'
            health:
              type: object
              additionalProperties: true
    SecurityHostPreviewRequest:
      type: object
      additionalProperties: false
      required:
      - requestId
      - action
      - reason
      - expectedDigest
      - settings
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        action:
          type: string
          enum:
          - aide.check
          - aide.schedule
          - nginx.configure
          - audit.profile
          - aide.profile
          - baseline.request
        reason:
          type: string
          minLength: 1
          maxLength: 500
        expectedDigest:
          type: string
        settings:
          type: object
          description: Action-specific allowlisted typed settings; no paths, commands, configuration text or credentials.
          additionalProperties: true
    SecurityHostPreview:
      type: object
      additionalProperties: false
      required:
      - requestId
      - action
      - previewHash
      - expiresAt
      - changes
      - requiresLocalApproval
      properties:
        requestId:
          type: string
        action:
          type: string
          enum:
          - aide.check
          - aide.schedule
          - nginx.configure
          - audit.profile
          - aide.profile
          - baseline.request
        previewHash:
          type: string
        expiresAt:
          type: string
          format: date-time
        changes:
          type: array
          items:
            type: string
        requiresLocalApproval:
          type: boolean
    SecurityHostApplyRequest:
      type: object
      additionalProperties: false
      required:
      - requestId
      - previewHash
      - reason
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        previewHash:
          type: string
        reason:
          type: string
          minLength: 1
          maxLength: 500
    SecurityHostOperation:
      type: object
      additionalProperties: false
      required:
      - seq
      - id
      - action
      - state
      - reason
      - actor
      - createdAt
      - updatedAt
      - result
      - error
      - previewHash
      - effectiveDigest
      properties:
        seq:
          type: integer
        id:
          type: string
        action:
          type: string
          enum:
          - aide.check
          - aide.schedule
          - nginx.configure
          - audit.profile
          - aide.profile
          - baseline.request
        state:
          type: string
          enum:
          - prepared
          - running
          - succeeded
          - failed
          - indeterminate
          - awaiting-local-approval
        reason:
          type: string
        actor:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        result:
          type: string
        error:
          type: string
        previewHash:
          type: string
        effectiveDigest:
          type: string
    SecurityHostOperations:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SecurityHostOperation'
        nextCursor:
          type:
          - string
          - 'null'
    SecurityTraffic:
      type: object
      required: [machineId, windowStart, windowEnd, category, requests, status429, status5xx, requestTimeSumMs, requestTimeMaxMs, responseBytes, requestBytes, dryRunHits]
      properties:
        machineId: { type: string, minLength: 1, maxLength: 100 }
        service: { type: string, maxLength: 63 }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        category: { type: string, enum: [auth, api, upload, socket, static, other] }
        requests: { type: integer, minimum: 0, maximum: 1000000000000 }
        status429: { type: integer, minimum: 0, maximum: 1000000000000 }
        status5xx: { type: integer, minimum: 0, maximum: 1000000000000 }
        requestTimeSumMs: { type: number, minimum: 0 }
        requestTimeMaxMs: { type: number, minimum: 0 }
        responseBytes: { type: integer, minimum: 0 }
        requestBytes: { type: integer, minimum: 0 }
        dryRunHits: { type: integer, minimum: 0, maximum: 1000000000000 }
    SecurityEvent:
      type: object
      additionalProperties: false
      required: [eventId, machineId, source, fingerprint, status, severity, summary, observedAt]
      properties:
        eventId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$' }
        machineId: { type: string, minLength: 1, maxLength: 100 }
        service: { type: string, maxLength: 63 }
        source: { type: string, enum: [nginx, auditd, aide, collector] }
        fingerprint: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$' }
        status: { type: string, enum: [firing, resolved] }
        severity: { type: string, enum: [info, warning, critical] }
        summary: { type: string, minLength: 1, maxLength: 500 }
        observedAt: { type: string, format: date-time }
        historical: { type: boolean, default: false }
    SecurityReceipt:
      type: object
      required: [accepted, duplicate, incidentId, historical]
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
        incidentId: { type: string }
        historical: { type: boolean }
    SecurityStatus:
      type: object
      required: [enabled, notificationsEnabled, machineId, pending, failed, overflow, expired, lastError, lastPollAt]
      properties:
        enabled: { type: boolean }
        notificationsEnabled: { type: boolean }
        machineId: { type: string }
        pending: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        overflow: { type: integer, minimum: 0 }
        expired: { type: integer, minimum: 0 }
        lastError: { type: string }
        lastPollAt: { type: [string, 'null'], format: date-time }
    SecurityIncident:
      type: object
      required: [seq, id, machineId, service, source, fingerprint, state, severity, summary, openedAt, observedAt, updatedAt, occurrences, revision, delivery, lastError, handling]
      properties:
        handling: { $ref: '#/components/schemas/SecurityHandling' }
        seq: { type: integer }
        id: { type: string }
        machineId: { type: string }
        service: { type: string }
        source: { type: string, enum: [nginx, auditd, aide, collector, machine, service] }
        fingerprint: { type: string }
        state: { type: string, enum: [firing, resolved, retired] }
        severity: { type: string, enum: [info, warning, critical] }
        summary: { type: string }
        openedAt: { type: string, format: date-time }
        observedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        occurrences: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1 }
        delivery: { type: string, enum: [disabled, pending, sent, failed, overflow, expired, filtered] }
        lastError: { type: string }
    MachineMaintenancePreview:
      type: object
      additionalProperties: false
      required:
      - resourceId
      - version
      - hash
      - partialCoverage
      - controllerOffline
      - manualPowerOn
      - workloads
      properties:
        resourceId:
          type: string
        version:
          type: integer
        hash:
          type: string
        partialCoverage:
          type: boolean
        controllerOffline:
          type: boolean
        manualPowerOn:
          type: boolean
        workloads:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - version
            - state
            - autostart
            properties:
              name:
                type: string
              version:
                type: integer
              state:
                type: string
              autostart:
                type: string
    MachineCoverage:
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state:
          type: string
        reason:
          type: string
    MachineFilesystem:
      type: object
      additionalProperties: false
      required:
      - path
      - total
      - available
      - inodes
      - freeInodes
      properties:
        path:
          type: string
        total:
          type: integer
        available:
          type: integer
        inodes:
          type: integer
        freeInodes:
          type: integer
    MachineSnapshot:
      type: object
      additionalProperties: false
      required:
      - id
      - observedAt
      - bootId
      - os
      - init
      - uptimeSeconds
      - cpuTotal
      - cpuIdle
      - cpuCount
      - cpuPercent
      - memoryTotal
      - memoryAvailable
      - swapTotal
      - swapFree
      - filesystems
      - coverage
      properties:
        id:
          type: integer
        observedAt:
          type: string
          format: date-time
        bootId:
          type: string
        os:
          type: string
        init:
          type: string
        uptimeSeconds:
          type: number
        cpuTotal:
          type: integer
        cpuIdle:
          type: integer
        cpuCount:
          type: integer
        cpuPercent:
          anyOf:
          - type: number
          - type: 'null'
        load:
          type: array
          items:
            type: number
        memoryTotal:
          type: integer
        memoryAvailable:
          type: integer
        swapTotal:
          type: integer
        swapFree:
          type: integer
        filesystems:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/MachineFilesystem'
          - type: 'null'
        interfaces:
          type: object
          additionalProperties:
            type: string
        units:
          type: object
          additionalProperties:
            type: string
        pressure:
          type: object
          additionalProperties:
            type: number
        coverage:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MachineCoverage'
    MachineStatus:
      type: object
      additionalProperties: false
      required:
      - snapshot
      - health
      - reasons
      - reasonMessages
      - identity
      - journal
      - fresh
      properties:
        snapshot:
          anyOf:
          - $ref: '#/components/schemas/MachineSnapshot'
          - type: 'null'
        health:
          type: string
        reasons:
          type: array
          items:
            type: string
        reasonMessages:
          type: array
          description: "`reasons` with codes (`health.*`), in the same order."
          items:
            $ref: '#/components/schemas/Message'
        identity:
          type: string
        journal:
          $ref: '#/components/schemas/MachineCoverage'
        fresh:
          type: boolean
    MachineMaintenance:
      type: object
      additionalProperties: false
      required:
      - resourceId
      - state
      - enteredAt
      - actor
      - reason
      - acknowledged
      - preview
      properties:
        resourceId:
          type: string
        state:
          type: string
        enteredAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Actor'
        reason:
          type: string
        acknowledged:
          type: boolean
        action:
          type: string
          description: The power action whose request entered maintenance; absent for a manual entry.
        preview:
          $ref: '#/components/schemas/MachineMaintenancePreview'
    MachinePowerRequest:
      type: object
      additionalProperties: false
      required:
      - controllerId
      - operationId
      - requestHash
      - action
      - bootId
      - deadline
      - issuedAt
      - validUntil
      properties:
        controllerId:
          type: string
        operationId:
          type: string
        requestHash:
          type: string
        action:
          type: string
        bootId:
          type: string
        deadline:
          type: string
          format: date-time
        issuedAt:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
    MachineReceipt:
      type: object
      additionalProperties: false
      required:
      - state
      - acceptedAt
      - bootId
      properties:
        state:
          type: string
        acceptedAt:
          type: string
          format: date-time
        bootId:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: Machine-readable code such as `not_found` or `version_conflict`.
            message: { type: string }
            details:
              type: object
              additionalProperties: true
    ValidationErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, enum: [validation_failed] }
            message: { type: string }
            details:
              type: object
              required: [issues]
              properties:
                issues:
                  type: array
                  items: { $ref: "#/components/schemas/Issue" }
    Message:
      type: object
      additionalProperties: false
      description: |
        A sentence the server produces for people, with a stable code and
        parameters so that clients can translate it. `message` is the English
        text; clients show it for a code they do not know. Free-form text has
        an empty code.
      required: [code, params, message]
      properties:
        code: { type: string, description: "Such as `health.stale` or `step.lock`; empty for free-form text." }
        params:
          type: object
          additionalProperties: { type: string }
        message: { type: string }
    Issue:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: Location in the document, such as `spec.nodes[3].next.true[0]`.
        message: { type: string }
    Actor:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [user, token, ai, system] }
        id: { type: string }
        name: { type: string }
    ServerHealth:
      type: object
      required: [status, version]
      properties:
        status: { type: string }
        version: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [actor, expiresAt]
      properties:
        actor: { $ref: "#/components/schemas/Actor" }
        expiresAt: { type: string, format: date-time }
    TokenScope:
      type: string
      enum: [admin, ingest]
    TokenCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        scope:
          $ref: "#/components/schemas/TokenScope"
          default: admin
    Token:
      type: object
      required: [id, name, scope, createdAt, lastUsedAt, revokedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        scope: { $ref: "#/components/schemas/TokenScope" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    TokenCreated:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The secret. It is shown only here.
    AuditEntry:
      type: object
      required: [id, time, actor, action, target, details, outcome]
      properties:
        id: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Actor" }
        action: { type: string }
        target: { type: string }
        details: { type: object, additionalProperties: true }
        outcome: { type: string, enum: [ok, denied, error] }
    Duration:
      type: string
      description: Go duration such as `30s` or `5m`.
      examples: ["30s"]
    Labels:
      type: object
      additionalProperties: { type: string }
    Metadata:
      type: object
      required: [name]
      properties:
        name: { type: string }
        labels: { $ref: "#/components/schemas/Labels" }
        annotations:
          allOf:
            - $ref: "#/components/schemas/Labels"
          description: |
            Free-form data for tools around LCM; the engine ignores it. Keys follow the
            label key syntax, and keys plus values may total 64 KiB. The web console keeps
            the policy graph layout in `lcm.dev/layout` (JSON) and reads an external
            dashboard link of a service from `lcm.dev/dashboard-url`.
    DocMeta:
      type: object
      required: [version, updatedAt, updatedBy]
      properties:
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: "#/components/schemas/Actor" }
    Command:
      type: object
      required: [command]
      properties:
        command: { type: string, description: Run with `sh -c`. }
        timeout: { $ref: "#/components/schemas/Duration" }
    Check:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, description: See `GET /check-types`. }
        interval: { $ref: "#/components/schemas/Duration" }
        timeout: { $ref: "#/components/schemas/Duration" }
        critical: { type: boolean, description: "Default true." }
        threshold: { type: integer, minimum: 1 }
        props: { type: object, additionalProperties: true }
    PolicyNode:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type: { type: string, description: See `GET /node-types`. }
        props: { type: object, additionalProperties: true }
        next:
          type: object
          description: Output port to the ids of the nodes it feeds.
          additionalProperties:
            type: array
            items: { type: string }
        timeout: { $ref: "#/components/schemas/Duration" }
        retry:
          type: object
          required: [max]
          properties:
            max: { type: integer }
            backoff: { $ref: "#/components/schemas/Duration" }
            maxBackoff: { $ref: "#/components/schemas/Duration" }
        joinMode: { type: string, enum: [all, any] }
    PolicyDocument:
      type: object
      description: A `lcm/v2` Policy.
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: { type: string, enum: [lcm/v2] }
        kind: { type: string, enum: [Policy] }
        metadata: { $ref: "#/components/schemas/Metadata" }
        spec:
          type: object
          required: [nodes]
          properties:
            concurrency:
              type: object
              properties:
                mode: { type: string, enum: [queue, drop, replace, parallel] }
                limit: { type: integer, minimum: 1 }
            timeout: { $ref: "#/components/schemas/Duration" }
            onInterrupt: { type: string }
            params: { type: object, additionalProperties: true }
            nodes:
              type: array
              items: { $ref: "#/components/schemas/PolicyNode" }
    ModuleDocument:
      type: object
      description: A `lcm/v2` Module.
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: { type: string, enum: [lcm/v2] }
        kind: { type: string, enum: [Module] }
        metadata: { $ref: "#/components/schemas/Metadata" }
        spec:
          type: object
          required: [nodes]
          properties:
            params:
              type: array
              items: { $ref: "#/components/schemas/ModuleParam" }
            nodes:
              type: array
              items: { $ref: "#/components/schemas/PolicyNode" }
    ModuleParam:
      type: object
      required: [name]
      properties:
        name: { type: string }
        default: {}
        description: { type: string }
    ServiceState:
      type: string
      enum: [registered, deploying, running, updating, rolling_back, stopped, failed]
    Health:
      type: string
      enum: [unknown, healthy, degraded, down]
    ActionName:
      type: string
      enum: [deploy, rollback, start, stop, restart, backup, run-job]
    ActionRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          description: Commit to deploy (7 to 64 hex digits); deploy only. The head of the configured branch when omitted.
        job:
          type: string
          description: Name of the job; run-job only, and required there.
        acknowledgeImpact:
          type: boolean
          description: Accept the impact of a disruptive action; see the dry run's `impact`.
    ActionSteps:
      type: object
      required: [resource, action, from, to, steps, stepMessages]
      properties:
        resource: { type: string }
        action: { $ref: "#/components/schemas/ActionName" }
        from: { $ref: "#/components/schemas/ServiceState" }
        to: { $ref: "#/components/schemas/ServiceState" }
        steps:
          type: array
          items: { type: string }
        stepMessages:
          type: array
          description: "`steps` with codes (`step.*`), in the same order."
          items: { $ref: "#/components/schemas/Message" }
    ActionStarted:
      description: A started action, answered with 202; the dry run answers an `ActionPlan` instead.
      type: object
      required: [actionId, status]
      properties:
        actionId: { type: string }
        status: { type: string, enum: [running] }
    ActionPlan:
      allOf:
        - $ref: "#/components/schemas/ActionSteps"
        - type: object
          required: [impact]
          properties:
            impact: { $ref: "#/components/schemas/ResourceImpact" }
    ImpactEntry:
      type: object
      required: [name, type, relation, via, depth]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/ResourceTypeName" }
        relation:
          type: string
          enum: [dependsOn, runsOn, controlPath]
          description: The relation of this resource to `via`.
        via: { type: string, description: The resource the relation targets. }
        depth: { type: integer, minimum: 1, description: "1 when the relation targets the acted-on resource." }
    ResourceImpact:
      type: object
      required: [resource, dependents, controlDependents, unresolved, acknowledgementRequired]
      properties:
        resource: { type: string }
        dependents:
          type: array
          description: Managed resources that depend on the resource, nearest first.
          items: { $ref: "#/components/schemas/ImpactEntry" }
        controlDependents:
          type: array
          description: Managed resources LCM reaches through the resource or one of its dependents.
          items: { $ref: "#/components/schemas/ImpactEntry" }
        unresolved:
          type: array
          description: Relation targets of the resource that do not exist.
          items: { type: string }
        action: { type: string, description: The action the guard was evaluated for. }
        acknowledgementRequired:
          type: boolean
          description: The action needs `acknowledgeImpact`; always false without an action.
    ResourceGroupActionRequest:
      type: object
      required: [selector, action]
      additionalProperties: false
      properties:
        selector:
          type: object
          additionalProperties: false
          description: At least one label or one name is required, so a group never selects every service by accident.
          properties:
            type: { type: string, enum: [service], description: Only services run group actions. }
            labels:
              type: object
              additionalProperties: { type: string }
            names:
              type: array
              maxItems: 200
              description: Narrows the services the labels match to these; each must be a managed service that matches the labels, or the request is refused. Without labels, the names alone select the group.
              items: { type: string, minLength: 1 }
        action: { $ref: "#/components/schemas/ActionName" }
        params:
          type: object
          additionalProperties: false
          properties:
            version: { type: string, description: Commit to deploy; deploy only. }
            job: { type: string, description: Job to run; run-job only, and required there. }
        dryRun: { type: boolean, default: false }
        acknowledgeImpact: { type: boolean, default: false }
    ResourceGroupSelector:
      type: object
      required: [type, labels]
      properties:
        type: { type: string, enum: [service] }
        labels:
          type: object
          additionalProperties: { type: string }
        names:
          type: array
          items: { type: string }
    ResourceGroupPlan:
      type: object
      required: [action, selector, steps, acknowledgementRequired]
      properties:
        action: { $ref: "#/components/schemas/ActionName" }
        selector: { $ref: "#/components/schemas/ResourceGroupSelector" }
        steps:
          type: array
          description: In execution order.
          items:
            type: object
            required: [resource, plan, error, impact]
            properties:
              resource: { type: string }
              plan:
                oneOf:
                  - $ref: "#/components/schemas/ActionSteps"
                  - type: "null"
              error: { type: string, description: Why the step could not run now; empty when it can. }
              impact: { $ref: "#/components/schemas/ResourceImpact" }
        acknowledgementRequired:
          type: boolean
          description: Some step needs `acknowledgeImpact`.
    ResourceGroupAction:
      type: object
      required: [id, action, status, actor, selector, startedAt, finishedAt, steps]
      properties:
        id: { type: string }
        action: { $ref: "#/components/schemas/ActionName" }
        status: { type: string, enum: [running, succeeded, failed] }
        actor: { $ref: "#/components/schemas/Actor" }
        selector: { $ref: "#/components/schemas/ResourceGroupSelector" }
        version: { type: string }
        job: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        steps:
          type: array
          items:
            type: object
            required: [resource, status, actionId, result, error]
            properties:
              resource: { type: string }
              status: { type: string, enum: [pending, running, succeeded, failed, notRun] }
              actionId: { type: string, description: The step's tracked action; empty until it starts. }
              result:
                oneOf:
                  - $ref: "#/components/schemas/ActionResult"
                  - type: "null"
              error: { type: string }
    ActionResult:
      type: object
      required: [resource, action, from, to, durationMs]
      properties:
        resource: { type: string }
        action: { $ref: "#/components/schemas/ActionName" }
        from: { $ref: "#/components/schemas/ServiceState" }
        to: { $ref: "#/components/schemas/ServiceState" }
        version: { type: string, description: The deployed commit. }
        previousVersion: { type: string }
        deploymentId: { type: integer, format: int64 }
        durationMs: { type: integer, format: int64 }
        output: { type: string, description: Tail of a backup or job command's output. }
        replayed: { type: boolean }
    Action:
      type: object
      required: [id, resource, action, status, actor, startedAt, finishedAt, result, error]
      properties:
        id: { type: string }
        resource: { type: string }
        action: { $ref: "#/components/schemas/ActionName" }
        status: { type: string, enum: [running, succeeded, failed] }
        actor: { $ref: "#/components/schemas/Actor" }
        version: { type: string }
        job: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        result:
          oneOf:
            - $ref: "#/components/schemas/ActionResult"
            - type: "null"
        error: { type: string }
    Deployment:
      type: object
      required: [id, resource, action, version, previousVersion, startedAt, finishedAt, outcome, actor, runId, error, logExcerpt]
      properties:
        id: { type: integer, format: int64 }
        resource: { type: string }
        action: { type: string, enum: [deploy, rollback] }
        version: { type: string }
        previousVersion: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        outcome: { type: string, enum: [running, succeeded, failed, interrupted] }
        actor: { $ref: "#/components/schemas/Actor" }
        runId: { type: string }
        error: { type: string }
        logExcerpt: { type: string }
    DeploymentList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Deployment" }
        nextCursor: { type: [string, "null"] }
    TimelineEntry:
      type: object
      required: [id, resource, time, kind, summary, summaryMessage, data, ref]
      properties:
        id:
          type: integer
          format: int64
          description: Row id; 0 in `timeline` events for entries whose id is not known.
        resource: { type: string }
        time: { type: string, format: date-time }
        kind:
          type: string
          description: "For example `config.changed`, `lifecycle.changed`, `deployment`, `action`, `backup`, `job`, `check.changed`, `health.changed`, `alert`."
        summary: { type: string }
        summaryMessage:
          allOf:
            - $ref: "#/components/schemas/Message"
          description: "`summary` with a code (`timeline.*`) derived from the kind and data; entries whose data predates a code keep an empty code."
        data: { type: object, additionalProperties: true }
        ref:
          type: string
          description: Run id, deployment id or signal id the entry relates to.
    TimelineList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        nextCursor: { type: [string, "null"] }
    CheckStatus:
      type: object
      required: [name, type, critical, intervalMs, status, stale, since, message, lastResult, lastLatencyMs, consecutiveFailures]
      properties:
        name: { type: string }
        type: { type: string }
        critical: { type: boolean }
        intervalMs: { type: integer, format: int64 }
        status: { type: string, enum: [unknown, up, down] }
        stale:
          type: boolean
          description: The stored status is older than twice the interval; `status` reads unknown until a fresh result.
        since: { type: [string, "null"], format: date-time }
        message: { type: string }
        lastResult: { type: [string, "null"], format: date-time }
        lastLatencyMs: { type: integer, format: int64 }
        consecutiveFailures: { type: integer }
    Checks:
      type: object
      required: [resource, health, since, checks]
      properties:
        resource: { type: string }
        health: { $ref: "#/components/schemas/Health" }
        since: { type: [string, "null"], format: date-time }
        checks:
          type: array
          items: { $ref: "#/components/schemas/CheckStatus" }
    SeriesPoint:
      type: object
      required: [time, count, failures, avgLatencyMs, minLatencyMs, maxLatencyMs]
      properties:
        time: { type: string, format: date-time }
        count: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        avgLatencyMs: { type: number }
        minLatencyMs: { type: number }
        maxLatencyMs: { type: number }
    Series:
      type: object
      required: [resource, check, from, to, source, stepMs, points]
      properties:
        resource: { type: string }
        check: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        source: { type: string, enum: [raw, rollup] }
        stepMs:
          type: integer
          format: int64
          description: Bucket width; 0 when every point is one raw result.
        points:
          type: array
          items: { $ref: "#/components/schemas/SeriesPoint" }
    SummaryStats:
      type: object
      required: [count, failures, uptime, avgLatencyMs, minLatencyMs, maxLatencyMs]
      properties:
        count: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        uptime:
          type: number
          description: Share of successful runs, 0 to 1; 0 with `count` 0 means no data.
        avgLatencyMs: { type: number }
        minLatencyMs: { type: number }
        maxLatencyMs: { type: number }
    ResourceSummaryStats:
      allOf:
        - $ref: "#/components/schemas/SummaryStats"
        - type: object
          required: [resource, window, checks]
          properties:
            resource: { type: string }
            window: { type: string, enum: [24h, 7d, 30d] }
            checks:
              type: object
              additionalProperties: { $ref: "#/components/schemas/SummaryStats" }
    CheckType:
      type: object
      required: [type, description]
      properties:
        type: { type: string }
        description: { type: string }
    Alert:
      type: object
      required: [source, fingerprint, name, severity, startedAt, updatedAt]
      properties:
        source: { type: string }
        fingerprint: { type: string }
        resource: { type: string }
        name: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        labels: { $ref: "#/components/schemas/Labels" }
        message: { type: string }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    AlertList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Alert" }
        nextCursor: { type: [string, "null"] }
    Trigger:
      type: object
      required: [id, type, props]
      properties:
        id: { type: string }
        type: { type: string }
        props: { type: object, additionalProperties: true }
    LastRun:
      type: object
      required: [id, status, mode, createdAt]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        mode: { $ref: "#/components/schemas/RunMode" }
        createdAt: { type: string, format: date-time }
    PolicySummary:
      type: object
      required: [name, labels, latestVersion, deployedVersion, deployed, paused, deployedAt, updatedAt, triggers, targets, lastRun, managedBy, relation]
      properties:
        name: { type: string }
        labels: { $ref: "#/components/schemas/Labels" }
        latestVersion: { type: integer }
        deployedVersion: { type: [integer, "null"] }
        deployed: { type: boolean }
        paused: { type: boolean }
        deployedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
        triggers:
          type: array
          items: { $ref: "#/components/schemas/Trigger" }
        targets:
          description: Nodes of the deployed version that act on a resource; empty when not deployed.
          type: array
          items: { $ref: "#/components/schemas/PolicyTarget" }
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/LastRun"
            - type: "null"
        managedBy: { $ref: "#/components/schemas/ManagedBy" }
        relation:
          description: How the policy concerns the resource of the `resource` filter; null when the list is not filtered.
          oneOf:
            - $ref: "#/components/schemas/PolicyRelation"
            - type: "null"
    PolicyRelation:
      type: object
      required: [kind, types]
      properties:
        kind:
          type: string
          enum: [acts, dynamic, watches]
          description: >-
            acts - nodes of the policy act on the resource; dynamic - a trigger listens to the
            resource and some node picks its resource at run time; watches - a trigger listens
            to the resource and no node acts on it.
        types:
          type: array
          description: Node types acting on the resource (kind acts), else empty.
          items: { type: string }
    PolicyTarget:
      type: object
      required: [node, type, resource]
      properties:
        node: { type: string, description: Scoped node id such as deploy or mod/restart. }
        type: { type: string }
        resource:
          description: The resource the node acts on; null when the policy decides it while running (for example from the trigger event).
          type: [string, "null"]
    PolicyList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PolicySummary" }
        nextCursor: { type: [string, "null"] }
    PolicyDoc:
      allOf:
        - $ref: "#/components/schemas/DocMeta"
        - type: object
          required: [document]
          properties:
            document: { $ref: "#/components/schemas/PolicyDocument" }
    PolicyDetail:
      allOf:
        - $ref: "#/components/schemas/PolicyDoc"
        - type: object
          required: [name, labels, latestVersion, deployedVersion, deployed, paused, deployedAt, triggers, lastRun, warnings, managedBy]
          properties:
            name: { type: string }
            labels: { $ref: "#/components/schemas/Labels" }
            latestVersion: { type: integer }
            deployedVersion: { type: [integer, "null"] }
            deployed: { type: boolean }
            paused: { type: boolean }
            deployedAt: { type: [string, "null"], format: date-time }
            triggers:
              type: array
              items: { $ref: "#/components/schemas/Trigger" }
            lastRun:
              oneOf:
                - $ref: "#/components/schemas/LastRun"
                - type: "null"
            managedBy: { $ref: "#/components/schemas/ManagedBy" }
            warnings:
              type: array
              description: Non-fatal compiler findings such as unreachable nodes.
              items: { $ref: "#/components/schemas/Issue" }
    PauseState:
      type: object
      required: [name, paused]
      properties:
        name: { type: string }
        paused: { type: boolean }
    DocVersionInfo:
      type: object
      required: [version, createdAt, createdBy]
      properties:
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Actor" }
    DocVersionList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DocVersionInfo" }
        nextCursor: { type: [string, "null"] }
    StateEntry:
      type: object
      required: [key, value, version, updatedAt]
      properties:
        key: { type: string }
        value: {}
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
    StateList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StateEntry" }
        nextCursor: { type: [string, "null"] }
    ManagedBy:
      type: [object, "null"]
      description: |
        Set when a config source manages the resource; null when only the web UI and
        API do. `drifted`: edited outside the repository. `conflict`: a commit was
        skipped because of that.
      required: [source, path, commit, drifted, conflict]
      properties:
        source: { type: string }
        path: { type: string, description: File in the repository. }
        commit: { type: string }
        drifted: { type: boolean }
        conflict: { type: boolean }
    ApplyResult:
      type: object
      required: [index, kind, name, action, version, diff, reason, issues, warnings, conflict, drifted, path]
      properties:
        index:
          type: integer
          description: Position of the document in the request body.
        kind:
          type: string
          description: Empty when the document does not say.
        name: { type: string }
        action:
          type: string
          enum: [create, update, unchanged, skipped, failed]
        version:
          type: integer
          description: Resource version after the apply; 0 when nothing was written or known.
        diff:
          type: string
          description: Unified diff of the canonical YAML, current to new.
        reason: { type: string }
        issues:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        conflict:
          type: boolean
          description: The repository changed a resource that was edited locally.
        drifted:
          type: boolean
        path:
          type: string
          description: File of a document that came from a config source; `-` for a request body.
    ApplyResponse:
      type: object
      required: [dryRun, items]
      properties:
        dryRun: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/ApplyResult" }
    ConfigSourceRequest:
      type: object
      additionalProperties: false
      required: [repo]
      properties:
        name:
          type: string
          description: 1-63 characters of a-z, 0-9, `.`, `_`, `-`. Required on create; on replace it must match the URL.
        repo: { type: string, description: Repository URL or local path. }
        branch: { type: string, default: main }
        path:
          type: string
          description: Directory (or file) in the repository; every `*.yaml` and `*.yml` below it is read, except `*.test.yaml`.
          default: "."
        interval:
          type: string
          description: Go duration between syncs, 10s to 24h.
          default: 1m
        enabled: { type: boolean, default: true }
    ConfigSource:
      type: object
      required: [name, repo, branch, path, interval, enabled, lastCommit, lastSyncAt, lastError, syncing, createdAt, updatedAt]
      properties:
        name: { type: string }
        repo: { type: string }
        branch: { type: string }
        path: { type: string }
        interval: { type: string }
        enabled: { type: boolean }
        lastCommit: { type: string, description: Commit the last sync read; empty before the first. }
        lastSyncAt: { type: [string, "null"], format: date-time }
        lastError:
          type: string
          description: What went wrong in the last sync, empty if nothing.
        syncing: { type: boolean, description: A sync of this source is running now. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConfigSourceList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConfigSource" }
        nextCursor: { type: [string, "null"] }
    Ownership:
      type: object
      required: [kind, name, source, path, commit, appliedVersion, appliedAt, drifted, missing, conflict, conflictCommit, acknowledged, orphaned]
      properties:
        kind: { type: string, enum: [Resource, Policy, Module] }
        name: { type: string }
        source: { type: string }
        path: { type: string }
        commit: { type: string }
        appliedVersion: { type: integer }
        appliedAt: { type: string, format: date-time }
        drifted: { type: boolean }
        missing: { type: boolean, description: The managed resource was deleted. }
        conflict: { type: boolean }
        conflictCommit: { type: string }
        acknowledged:
          type: boolean
          description: The operator chose to keep the current content.
        orphaned: { type: boolean }
    OwnershipList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Ownership" }
        nextCursor: { type: [string, "null"] }
    ValidationResult:
      type: object
      required: [kind, name, valid, issues, warnings]
      properties:
        kind:
          type: string
          description: Empty when the document does not say.
        name: { type: string }
        valid: { type: boolean }
        issues:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
    Template:
      type: object
      description: |
        Titles, descriptions and parameter descriptions are English; clients
        translate them by template `id` and parameter `name`.
      required: [id, title, description, resourceParam, params]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        resourceParam:
          type: string
          description: Name of the parameter that selects the target resource, a service.
        params:
          type: array
          items: { $ref: "#/components/schemas/TemplateParam" }
    TemplateParam:
      type: object
      required: [name, type, description, required]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [string, boolean, duration, secret, service, strings, json, windows]
          description: |
            `secret` is the name of a secret, `service` the name of a service
            resource, `duration` Go syntax such as `5m`, `strings` a list of
            strings, `json` any JSON value and `windows` a list of
            `{days, start, end}` deploy windows (days `mon`..`sun`, optional;
            start and end `HH:MM`, end up to `24:00`).
        description: { type: string }
        required: { type: boolean }
        requiredIf:
          type: string
          description: Name of a boolean parameter that makes this one required while it is true.
        default:
          description: Absent for required parameters.
        enum:
          type: array
          description: The allowed values of a string parameter.
          items: { type: string }
        prefill:
          type: string
          description: |
            Path in the `spec.config` of the resource that the resource
            parameter selects, such as `source.branch`; a form may fill the
            parameter from it until the user edits it.
        visibleIf:
          type: object
          description: |
            Shows the parameter only while the enum parameter `param` has the
            value `equals`, such as the fields of one notification target. A
            hidden parameter keeps its default.
          required: [param, equals]
          properties:
            param: { type: string }
            equals: { type: string }
    TemplateInstance:
      type: object
      required: [template, name, yaml, version, deployed, warnings]
      properties:
        template: { type: string }
        name: { type: string }
        yaml:
          type: string
          description: The concrete policy document.
        version:
          type: [integer, "null"]
          description: Null for a dry run.
        deployed: { type: boolean }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
    ModuleSummary:
      type: object
      required: [name, labels, params, version, updatedAt, updatedBy]
      properties:
        name: { type: string }
        labels: { $ref: "#/components/schemas/Labels" }
        params:
          type: array
          items: { $ref: "#/components/schemas/ModuleParam" }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: "#/components/schemas/Actor" }
    ModuleList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ModuleSummary" }
        nextCursor: { type: [string, "null"] }
    ModuleDoc:
      allOf:
        - $ref: "#/components/schemas/DocMeta"
        - type: object
          required: [document]
          properties:
            document: { $ref: "#/components/schemas/ModuleDocument" }
    NodeProp:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [string, integer, number, boolean, duration, array, object, any] }
        required: { type: boolean }
        expr:
          type: boolean
          description: The value is a bare expression.
        enum:
          type: array
          items: { type: string }
        default: {}
        description: { type: string }
        items: { $ref: "#/components/schemas/NodeProp" }
        props:
          type: array
          items: { $ref: "#/components/schemas/NodeProp" }
    NodeType:
      type: object
      required: [type, category, effect, ports, props]
      properties:
        type: { type: string }
        category: { type: string }
        description: { type: string }
        effect: { type: string, enum: [none, read, write] }
        ports:
          type: array
          description: Output ports; `error` is implicit.
          items: { type: string }
        dynamicPorts:
          type: boolean
          description: Ports depend on the props; `ports` lists only the fixed ones.
        props:
          type: array
          items: { $ref: "#/components/schemas/NodeProp" }
        additionalProps:
          type: boolean
          description: The props are a free-form object.
    RunStatus:
      type: string
      enum: [queued, running, suspended, succeeded, failed, cancelled, interrupted, dropped]
    RunMode:
      type: string
      enum: [live, dry]
    NodeStatus:
      type: string
      enum: [pending, ready, running, retrying, suspended, completed, failed, dead]
    StartRunRequest:
      type: object
      additionalProperties: false
      properties:
        trigger:
          type: string
          description: Trigger node id; the only `trigger.manual` node when omitted.
        event:
          description: Becomes `trigger` in the run's expressions.
        mode:
          allOf:
            - $ref: "#/components/schemas/RunMode"
          default: live
    RunStarted:
      type: object
      required: [runId, policy, trigger, mode]
      properties:
        runId: { type: string }
        policy: { type: string }
        trigger: { type: string }
        mode: { $ref: "#/components/schemas/RunMode" }
    RunRef:
      type: object
      required: [runId]
      properties:
        runId: { type: string }
    ResumeRequest:
      type: object
      required: [key]
      additionalProperties: false
      properties:
        key: { type: string, description: The node's `suspendKey`. }
        payload: { description: Handed to the node as the resume payload. }
    RunSummary:
      type: object
      required: [id, policy, version, status, mode, triggerNode, createdAt]
      properties:
        id: { type: string }
        policy: { type: string }
        version: { type: integer }
        status: { $ref: "#/components/schemas/RunStatus" }
        mode: { $ref: "#/components/schemas/RunMode" }
        triggerNode: { type: string }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    RunList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RunSummary" }
        nextCursor: { type: [string, "null"] }
    RunNode:
      type: object
      required: [id, type, status]
      properties:
        id: { type: string, description: Scoped id such as `outer/inner/check` for module nodes. }
        type: { type: string }
        status: { $ref: "#/components/schemas/NodeStatus" }
        port: { type: string, description: The output port the node took. }
        props: { description: Resolved props. }
        output: {}
        attempts: { type: integer }
        error: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        suspendKey: { type: string }
        resumeAt: { type: string, format: date-time }
    Run:
      allOf:
        - $ref: "#/components/schemas/RunSummary"
        - type: object
          required: [event, nodes]
          properties:
            event:
              description: The trigger event.
            nodes:
              type: array
              description: In topological order.
              items: { $ref: "#/components/schemas/RunNode" }
    LockInfo:
      type: object
      required: [name, owner, acquiredAt, expiresAt]
      properties:
        name: { type: string }
        owner: { type: string }
        acquiredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    LockList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LockInfo" }
        nextCursor: { type: [string, "null"] }
    GitHubAck:
      type: object
      required: [event]
      properties:
        event: { type: string }
        ignored:
          type: boolean
          description: True for events that start nothing (pings, tags, deleted branches).
        repository: { type: string }
        branch: { type: string }
        commit: { type: string }
        matched:
          type: integer
          description: Number of `trigger.git` nodes notified.
        sources:
          type: integer
          description: Number of config sources that will sync because of this push.
    EventType:
      type: string
      enum:
      - signal
      - run
      - node
      - timeline
      - action
      - resource
      - observation
      - catalog
    EngineEvent:
      type: object
      description: Payload of `run` and `node` events, and of policy deployments in `catalog` events.
      required: [kind, time, policy]
      properties:
        kind:
          type: string
          enum:
            - policy.deployed
            - policy.undeployed
            - run.queued
            - run.started
            - run.suspended
            - run.resumed
            - run.finished
            - node.started
            - node.finished
            - node.retrying
            - node.suspended
            - node.dead
        time: { type: string, format: date-time }
        policy: { type: string }
        version: { type: integer }
        runId: { type: string }
        mode: { $ref: "#/components/schemas/RunMode" }
        status: { type: string, description: Run status for run events, node status for node events. }
        nodeId: { type: string }
        nodeType: { type: string }
        port: { type: string }
        attempt: { type: integer }
        error: { type: string }
        retryAt: { type: string, format: date-time }
    Signal:
      type: object
      description: Payload of `signal` events.
      required: [id, kind, time, source]
      properties:
        id: { type: string }
        kind:
          type: string
          description: "check.changed, health.changed, lifecycle.changed, alert, or resource.config.conflict / resource.config.invalid from config sync."
        time: { type: string, format: date-time }
        resource: { type: string }
        resourceType: { $ref: "#/components/schemas/ResourceTypeName" }
        source: { type: string }
        severity: { type: string }
        labels: { $ref: "#/components/schemas/Labels" }
        data: { type: object, additionalProperties: true }
    EventEnvelope:
      type: object
      description: The `data` of every server-sent event.
      required:
      - id
      - type
      - time
      - data
      properties:
        id:
          type: integer
          format: int64
          description: Increases with every event.
        type:
          $ref: '#/components/schemas/EventType'
        time:
          type: string
          format: date-time
        resource:
          type: string
          description: Name of the resource the event is about.
        resourceId:
          type: string
          description: Immutable resource ID, for resource changes and observations.
        policy:
          type: string
        run:
          type: string
        data:
          description: Depends on `type`.
          oneOf:
          - $ref: '#/components/schemas/Signal'
          - $ref: '#/components/schemas/EngineEvent'
          - $ref: '#/components/schemas/TimelineEntry'
          - $ref: '#/components/schemas/Action'
          - $ref: '#/components/schemas/ResourceChange'
          - $ref: '#/components/schemas/ResourceEvent'
    ResourceTypeName:
      type: string
      enum: [service, machine, router]
    ResourcePhase:
      type: string
      enum: [managed, retired, unmanaged]
      description: "`managed` is observed and controlled; `retired` keeps records without observation or control and can be resumed; `unmanaged` is archived and has released its name."
    ResourceAction:
      type: object
      required: [name, available, reason, reasonMessage, risk, policy, kind]
      properties:
        name: { type: string, description: "Action, operation or phase change, such as `restart`, `reboot` or `retire`." }
        available: { type: boolean }
        reason:
          type: string
          description: "Why the action is unavailable now; empty when available. Services use the codes notConfigured, unsupported, invalidState, notManaged or busy, and the shared text reasons of every type otherwise (`release Git ownership first` when a config source owns a service to unmanage)."
        reasonMessage:
          $ref: "#/components/schemas/Message"
          description: "`reason` with a code for translation (`action.*`, `capability.*`); the services' own reason codes have none."
        risk: { type: string, enum: [read, reversible, disruptive, destructive] }
        policy: { type: boolean, description: Whether policies may run it. }
        kind:
          type: string
          enum: [action, operation, phase]
          description: "`action` runs through `POST /resources/{resource}/actions/{action}` (services) or its own route (observe, maintenance); `operation` through `POST /resources/{resource}/operations`; `phase` through `POST /resources/{resource}/phase`."
    ResourceType:
      type: object
      required: [type, adapters, needsConnection, description, actions]
      properties:
        type: { $ref: "#/components/schemas/ResourceTypeName" }
        adapters:
          type: array
          items: { type: string }
        needsConnection:
          type: boolean
          description: The adapter reaches the resource through a connection named in `spec.connection` and defined in host configuration.
        description: { type: string }
        actions:
          type: array
          description: Everything the type offers; `available` and `reason` are only meaningful on a resource.
          items: { $ref: "#/components/schemas/ResourceAction" }
    Relation:
      type: object
      required: [type, target]
      additionalProperties: false
      properties:
        type: { type: string, enum: [dependsOn, runsOn, controlPath] }
        target: { type: string, description: Name of another resource. }
    ResourceDocument:
      type: object
      description: A `lcm/v2` Resource.
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: { type: string, enum: [lcm/v2] }
        kind: { type: string, enum: [Resource] }
        metadata: { $ref: "#/components/schemas/Metadata" }
        spec:
          type: object
          required: [type, adapter]
          properties:
            type: { $ref: "#/components/schemas/ResourceTypeName" }
            adapter:
              type: string
              description: "service: systemd, docker, compose, command or external; machine: local; router: xiaomi. See `GET /resource-types`."
            connection:
              type: string
              description: Name of a host-configured connection; only for adapters that need one.
            config:
              type: object
              additionalProperties: true
              description: |
                Typed by `type` and `adapter` and validated strictly by the server (unknown
                fields are refused). service: the runtime fields valid for the adapter
                (`unit`, `scope`, `container`, `project`, `file`, `start`, `stop`,
                `restart`, `status`) plus `source`, `backup` and `jobs`. machine:
                `interval`, `staleAfter`, `filesystems`, `interfaces`, `units`, `journal`,
                `thresholds`. router: `interval`, `staleAfter`, `thresholds`
                (`cpuPercent`, `memoryPercent`, `consecutive`, `hysteresis`).
            checks:
              type: array
              items: { $ref: "#/components/schemas/Check" }
            relations:
              type: array
              items: { $ref: "#/components/schemas/Relation" }
    ResourceSummary:
      type: object
      required: [id, name, type, adapter, phase, labels, state, stateSince, health, version, updatedAt, deployedVersion, managedBy, relations]
      properties:
        id: { type: string, description: Immutable ID; `@<id>` addresses any incarnation, including archives. }
        name: { type: string }
        type: { $ref: "#/components/schemas/ResourceTypeName" }
        adapter: { type: string }
        phase: { $ref: "#/components/schemas/ResourcePhase" }
        labels: { $ref: "#/components/schemas/Labels" }
        state:
          type: string
          description: "service: registered, deploying, running, updating, rolling_back, stopped or failed; machine and router: online, offline or unknown. Empty when not known."
        stateSince: { type: [string, "null"], format: date-time }
        health: { $ref: "#/components/schemas/Health" }
        version:
          type: integer
          description: Version of the configuration document.
        updatedAt: { type: string, format: date-time }
        deployedVersion:
          type: string
          description: Commit of a service's last successful deployment; empty if none and for other types.
        managedBy: { $ref: "#/components/schemas/ManagedBy" }
        relations:
          type: array
          description: The relations the document declares, as in `ResourceDocument.spec.relations`, so a view of the whole fleet needs one request.
          items: { $ref: "#/components/schemas/Relation" }
    Overview:
      type: object
      required: [generatedAt, types, attention, resources, activeRuns, deploys, firingAlerts]
      properties:
        generatedAt: { type: string, format: date-time }
        types:
          type: array
          description: One entry per resource type that has resources, in display order.
          items:
            type: object
            required: [type, total, retired, health]
            properties:
              type: { $ref: "#/components/schemas/ResourceTypeName" }
              total: { type: integer }
              retired: { type: integer }
              health:
                type: object
                description: Managed resources by health; every health value is present.
                additionalProperties: { type: integer }
        attention:
          type: array
          description: Managed resources whose health is down or degraded, whose state is failed, or that have firing alerts; most urgent first.
          items:
            type: object
            required: [name, type, state, health, since, firingAlerts, reasons]
            properties:
              name: { type: string }
              type: { $ref: "#/components/schemas/ResourceTypeName" }
              state: { type: string }
              health: { $ref: "#/components/schemas/Health" }
              since: { type: [string, "null"], format: date-time, description: When the combined health last changed. }
              firingAlerts: { type: integer }
              reasons:
                type: array
                items: { $ref: "#/components/schemas/Message" }
        resources:
          type: array
          description: Managed resources, by name.
          items:
            type: object
            required: [name, type, state, health, deployedVersion, lastDeployedAt, managedBy, hasChecks, uptime, buckets]
            properties:
              name: { type: string }
              type: { $ref: "#/components/schemas/ResourceTypeName" }
              state: { type: string }
              health: { $ref: "#/components/schemas/Health" }
              deployedVersion: { type: string, description: Commit of a service's last successful deployment; empty if none and for other types. }
              lastDeployedAt: { type: [string, "null"], format: date-time }
              managedBy: { $ref: "#/components/schemas/ManagedBy" }
              hasChecks: { type: boolean }
              uptime:
                type: [number, "null"]
                description: Share of passing check results over the last 24 hours; null when no check ran.
              buckets:
                type: array
                description: Availability in 24 hourly buckets, oldest first; empty when no check ran in the window.
                items:
                  type: object
                  required: [ratio, failures]
                  properties:
                    ratio: { type: [number, "null"], description: Share of passing results; null when no check ran in the bucket. }
                    failures: { type: integer }
        activeRuns: { type: integer, description: Runs that are queued, running or suspended. }
        deploys:
          type: object
          required: [since, count]
          properties:
            since: { type: string, format: date-time }
            count: { type: integer, description: Deployments and rollbacks started since then. }
        firingAlerts: { type: integer }
    ResourceList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ResourceSummary" }
        nextCursor: { type: [string, "null"] }
    ResourceHealth:
      type: object
      required: [status, since, reasons, reasonMessages]
      properties:
        status: { $ref: "#/components/schemas/Health" }
        since: { type: [string, "null"], format: date-time }
        reasons:
          type: array
          description: The type's own findings (thresholds, reachability) followed by failing checks.
          items: { type: string }
        reasonMessages:
          type: array
          description: "`reasons` with codes (`health.*`), in the same order."
          items: { $ref: "#/components/schemas/Message" }
    ResourceDetail:
      type: object
      required: [id, name, type, adapter, connection, phase, labels, document, version, createdAt, updatedAt, updatedBy, state, stateSince, health, checks, alerts, actions, operation, managedBy, unresolvedRelations]
      properties:
        id: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/ResourceTypeName" }
        adapter: { type: string }
        connection: { type: string, description: Empty when the adapter needs none. }
        phase: { $ref: "#/components/schemas/ResourcePhase" }
        labels: { $ref: "#/components/schemas/Labels" }
        document: { $ref: "#/components/schemas/ResourceDocument" }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: "#/components/schemas/Actor" }
        state: { type: string, description: See `ResourceSummary.state`. }
        stateSince: { type: [string, "null"], format: date-time }
        health: { $ref: "#/components/schemas/ResourceHealth" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/CheckStatus" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/Alert" }
        actions:
          description: What can be done now. A service rollback may still find no target; the dry-run is definitive.
          type: array
          items: { $ref: "#/components/schemas/ResourceAction" }
        operation:
          description: The durable operation whose outcome is still open, if any.
          oneOf:
            - $ref: "#/components/schemas/ResourceOperation"
            - type: "null"
        managedBy: { $ref: "#/components/schemas/ManagedBy" }
        unresolvedRelations:
          description: Relation targets of the document that name no resource yet, sorted; such a relation counts once the target exists. Empty for archives.
          type: array
          items: { type: string }
        service:
          type: object
          description: Services only.
          required: [deployedVersion, lastDeployment]
          properties:
            deployedVersion: { type: string }
            lastDeployment:
              oneOf:
                - $ref: "#/components/schemas/Deployment"
                - type: "null"
        machine:
          type: object
          description: Machines only.
          required: [status]
          properties:
            status:
              oneOf:
                - $ref: "#/components/schemas/MachineStatus"
                - type: "null"
        router:
          type: object
          description: Routers only.
          required: [status]
          properties:
            status:
              oneOf:
                - $ref: "#/components/schemas/RouterStatus"
                - type: "null"
    ResourcePhaseRequest:
      type: object
      required: [phase]
      additionalProperties: false
      properties:
        phase: { $ref: "#/components/schemas/ResourcePhase" }
        version:
          type: integer
          minimum: 1
          description: The current document version; `If-Match` may carry it instead.
        reason: { type: string, maxLength: 1000 }
        acknowledgeImpact:
          type: boolean
          description: Accept the impact of retiring a service (it is stopped first).
    ResourceVersion:
      allOf:
        - $ref: "#/components/schemas/DocMeta"
        - type: object
          required: [document, restoredFrom]
          properties:
            document: { $ref: "#/components/schemas/ResourceDocument" }
            restoredFrom:
              type: [integer, "null"]
              description: The version this one was restored from.
    ResourceVersionInfo:
      type: object
      required: [version, createdAt, createdBy, restoredFrom]
      properties:
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Actor" }
        restoredFrom: { type: [integer, "null"] }
    ResourceVersionList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ResourceVersionInfo" }
        nextCursor: { type: [string, "null"] }
    ResourceSnapshot:
      description: One stored observation; `type` (the resource type) selects the shape of the measurements in `data`.
      oneOf:
        - $ref: "#/components/schemas/MachineResourceSnapshot"
        - $ref: "#/components/schemas/RouterResourceSnapshot"
      discriminator:
        propertyName: type
        mapping:
          machine: "#/components/schemas/MachineResourceSnapshot"
          router: "#/components/schemas/RouterResourceSnapshot"
    MachineResourceSnapshot:
      type: object
      additionalProperties: false
      required: [id, resourceId, type, observedAt, data]
      properties:
        id: { type: integer, format: int64 }
        resourceId: { type: string }
        type: { type: string, enum: [machine] }
        observedAt: { type: string, format: date-time }
        data: { $ref: "#/components/schemas/MachineSnapshot" }
    RouterResourceSnapshot:
      type: object
      additionalProperties: false
      required: [id, resourceId, type, observedAt, data]
      properties:
        id: { type: integer, format: int64 }
        resourceId: { type: string }
        type: { type: string, enum: [router] }
        observedAt: { type: string, format: date-time }
        data: { $ref: "#/components/schemas/RouterSnapshot" }
    ResourceEvent:
      type: object
      additionalProperties: false
      required: [id, resourceId, source, kind, severity, occurredAt, ingestedAt, historical]
      properties:
        id: { type: integer, format: int64 }
        resourceId: { type: string }
        source: { type: string, description: "`control`, `journal` or `health`." }
        kind: { type: string }
        severity: { type: string }
        occurredAt: { type: string, format: date-time }
        ingestedAt: { type: string, format: date-time }
        bootId: { type: string }
        unit: { type: string }
        historical: { type: boolean }
        reason: { type: string }
        reasonMessage:
          allOf:
            - $ref: "#/components/schemas/Message"
          description: "`reason` with a code that depends on the event; set by the event list when there is a reason."
        operationId: { type: string }
    ResourceCapability:
      type: object
      additionalProperties: false
      required: [action, available, reason, reasonMessage]
      properties:
        action: { type: string }
        available: { type: boolean }
        reason: { type: string }
        reasonMessage: { $ref: "#/components/schemas/Message" }
    ResourceOperation:
      type: object
      additionalProperties: false
      description: A durable operation. `request`, `receipt` and `evidence` are type-specific.
      required: [id, resourceId, action, state, unresolved, version, createdAt, updatedAt, actor, request, receipt, reason, reasonMessage]
      properties:
        id: { type: string }
        resourceId: { type: string }
        action: { type: string }
        state: { type: string, description: "For example pending, submitted, succeeded, failed or indeterminate." }
        unresolved: { type: boolean, description: The outcome is not known yet or needs `resolve`. }
        version: { type: integer, description: Document version the operation was submitted against. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Actor" }
        request: { type: object, additionalProperties: true }
        receipt:
          type: [object, "null"]
          additionalProperties: true
        reason: { type: string, description: Explains the current state. }
        reasonMessage:
          $ref: "#/components/schemas/Message"
          description: "`reason` with a code for translation (`op.*`)."
        requestReason: { type: string, description: The operator's reason for the request. }
        resolution: { type: string }
        resolvedBy: { $ref: "#/components/schemas/Actor" }
        resolvedAt: { type: string, format: date-time }
        evidence: { type: object, additionalProperties: true }
    RouterWAN:
      type: object
      additionalProperties: false
      required: [link, status, uptimeSeconds, upBytesPerSec, downBytesPerSec, uploadedBytes, downloadedBytes]
      description: WAN link and traffic; addresses, DNS servers and MAC addresses are never read.
      properties:
        link: { type: [boolean, "null"] }
        status: { type: [integer, "null"] }
        uptimeSeconds: { type: [number, "null"] }
        type: { type: string, description: "Connection type the router reports, such as `dhcp` or `pppoe`." }
        upBytesPerSec: { type: [number, "null"] }
        downBytesPerSec: { type: [number, "null"] }
        uploadedBytes: { type: [integer, "null"], format: int64 }
        downloadedBytes: { type: [integer, "null"], format: int64 }
    RouterSnapshot:
      type: object
      additionalProperties: false
      required: [id, observedAt, outcome, cpuPercent, cpuCores, memoryPercent, uptimeSeconds, temperatureC, clients, wan, sources, model, firmware]
      description: One observation attempt; measurements the router did not report are null.
      properties:
        id: { type: integer, format: int64 }
        observedAt: { type: string, format: date-time }
        outcome:
          type: string
          enum: [ok, unreachable, auth-failed, unavailable, not-configured]
          description: "`unreachable`: no HTTP answer; `unavailable`: an answer without usable status; `not-configured`: no usable connection or password secret on this host."
        reason: { type: string, description: Fixed description of a failed attempt. }
        reasonMessage:
          $ref: "#/components/schemas/Message"
          description: "`reason` with a code for translation."
        cpuPercent: { type: [number, "null"] }
        cpuCores: { type: [integer, "null"] }
        memoryPercent: { type: [number, "null"] }
        uptimeSeconds: { type: [number, "null"] }
        temperatureC: { type: [number, "null"] }
        clients: { type: [integer, "null"], description: Online clients. }
        wan: { $ref: "#/components/schemas/RouterWAN" }
        sources:
          type: object
          description: Availability of each status source (`status`, `wan`).
          additionalProperties: { $ref: "#/components/schemas/RouterCoverage" }
        model: { type: string }
        firmware: { type: string }
    RouterCoverage:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string }
        reason: { type: string }
        reasonMessage:
          $ref: "#/components/schemas/Message"
          description: "`reason` with a code for translation (`router.*`)."
    RouterStatus:
      type: object
      additionalProperties: false
      required: [snapshot, health, reasons, reasonMessages, fresh, reachability, bootAt]
      properties:
        snapshot:
          description: The latest observation attempt.
          oneOf:
            - $ref: "#/components/schemas/RouterSnapshot"
            - type: "null"
        health: { $ref: "#/components/schemas/Health" }
        reasons:
          type: array
          items: { type: string }
        reasonMessages:
          type: array
          description: "`reasons` with codes (`health.*`), in the same order."
          items: { $ref: "#/components/schemas/Message" }
        fresh: { type: boolean, description: The latest attempt is younger than `staleAfter`. }
        reachability: { type: string, enum: [reachable, unreachable, unknown] }
        bootAt:
          type: [string, "null"]
          format: date-time
          description: Last boot estimated from the reported uptime.
    Connection:
      type: object
      additionalProperties: false
      required: [name, type, allowActions, allowResources, resources]
      properties:
        name: { type: string }
        type: { type: string, enum: [xiaomi] }
        allowActions:
          type: array
          description: Write actions resources may perform through the connection; others are refused.
          items: { type: string }
        allowResources:
          type: array
          description: Resource names that may use the connection; empty allows none.
          items: { type: string }
        resources:
          type: array
          description: Managed and retired resources whose document names the connection.
          items: { type: string }
    ResourceChange:
      type: object
      description: Payload of `resource` events.
      required: [id, name, type, change]
      properties:
        id: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/ResourceTypeName" }
        change: { type: string, enum: [created, updated, restored, phase, unmanaged] }
