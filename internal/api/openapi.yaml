openapi: 3.1.0
info:
  title: LCM API
  version: "1"
  description: |
    HTTP API of LCM, the self-hosted lifecycle control plane for services, the local machine and routers.

    **Conventions**

    - Base path `/api/v1`; JSON field names are camelCase; times are RFC 3339 in UTC.
    - Errors use one envelope, `{"error": {"code", "message", "details"}}`.
      Status codes: 400 malformed request, 401 not authenticated, 403 not allowed
      (including a token scope that does not permit the endpoint), 404 unknown
      resource, 409 conflict (version mismatch, lock held, invalid state), 413 body
      too large, 422 validation failed (`details.issues` lists `{path, message}`),
      429 rate limited, 500 internal error, 503 shutting down.
    - Documents (`lcm/v2` Resource, Policy, Module) are sent as `application/yaml`
      or `application/json` and returned as JSON. Policies and modules answer
      `{document, version, updatedAt, updatedBy}` plus their own fields; resources
      answer a `ResourceDetail`. The `ETag` response header carries the version.
    - Optimistic locking: `PUT` needs `If-Match: <version>` (quoted or not). A stale
      version answers 409 `version_conflict` with `details.currentVersion`.
      Policies and modules are created by `PUT` without `If-Match` (or with `*`);
      resources are created by `POST /resources`. `{resource}` in a path is a name, or
      `@<id>` for any incarnation (archives are read only).
    - A route that the resource's type does not offer (observing a service,
      deploying a machine) answers 409 `unsupported`.
    - Lists take `limit` (default 50, maximum 500) and an opaque `cursor`, and
      answer `{items, nextCursor}`; `nextCursor` is null on the last page. Short
      enumerations (`/resource-types`, `/node-types`, `/check-types`) answer `{items}` only.
      `/audit` predates this convention and pages with `before` and `nextBefore`.
    - Actions on services run in the background: they answer 202 with an
      `actionId` that `GET /actions/{id}` reports on. Their outcome also appears on
      the timeline and in the event stream.

    **Authentication**

    A browser session cookie (`POST /auth/login`) or `Authorization: Bearer <token>`.
    Sessions and `admin` tokens may use the whole API except token management,
    which is session-only. `ingest` tokens may only call the alert, security-event, heartbeat and
    webhook endpoints (and `GET /auth/me`).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: Meta
  - name: Auth
  - name: Resources
  - name: Actions
  - name: Monitoring
  - name: Policies
  - name: Config
  - name: Modules
  - name: Runs
  - name: Locks
  - name: Ingest
  - name: Events

paths:
  /health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerHealth" }
        "503":
          description: The database is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /openapi.yaml:
    get:
      tags: [Meta]
      operationId: getOpenAPI
      summary: This document
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Start a session
      description: Sets the `lcm_session` cookie. Failures are rate limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the session
      description: Session only.
      responses:
        "204": { description: Logged out. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The authenticated caller
      description: Available to every authenticated caller, including ingest tokens.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                type: object
                required: [actor]
                properties:
                  actor: { $ref: "#/components/schemas/Actor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tokens:
    get:
      tags: [Auth]
      operationId: listTokens
      summary: List API tokens
      description: Session only. Secrets are never listed.
      responses:
        "200":
          description: Tokens, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Auth]
      operationId: createToken
      summary: Create an API token
      description: Session only. The secret is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreateRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /tokens/{id}:
    delete:
      tags: [Auth]
      operationId: revokeToken
      summary: Revoke an API token
      description: Session only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /audit:
    get:
      tags: [Auth]
      operationId: listAudit
      summary: Audit log
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: before
          in: query
          description: Return entries with an id below this one.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: from
          in: query
          description: Only entries at or after this instant.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Only entries before this instant.
          schema: { type: string, format: date-time }
        - name: actor
          in: query
          description: Only entries of the actor with this name.
          schema: { type: string }
        - name: action
          in: query
          description: Only this action, or every action under a dotted prefix (`service` matches `service.deploy`).
          schema: { type: string }
        - name: target
          in: query
          description: Only entries whose target is exactly this, such as a resource name.
          schema: { type: string }
      responses:
        "200":
          description: Entries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextBefore]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  nextBefore:
                    type: [integer, "null"]
                    format: int64
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /actions/{id}:
    get:
      tags: [Actions]
      operationId: getAction
      summary: Progress and outcome of an action
      description: Only the most recent 500 actions are remembered, and not across restarts.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Action" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /check-types:
    get:
      tags: [Monitoring]
      operationId: listCheckTypes
      summary: Registered check types
      responses:
        "200":
          description: Check types.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CheckType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /alerts:
    get:
      tags: [Monitoring]
      operationId: listAlerts
      summary: External alerts
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: resource
          in: query
          description: Only alerts of this resource.
          schema: { type: string }
        - name: state
          in: query
          description: Which alerts to list; resolved alerts are kept for the monitoring retention.
          schema: { type: string, enum: [firing, resolved, all], default: firing }
      responses:
        "200":
          description: Firing alerts come first, oldest first, then resolved alerts, most recently resolved first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /resource-types:
    get:
      tags: [Resources]
      operationId: listResourceTypes
      summary: Registered resource types
      description: Types, their adapters and the actions they offer. Clients build forms and menus from it instead of repeating server rules.
      responses:
        "200":
          description: Resource types in display order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ResourceType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /resources:
    get:
      tags: [Resources]
      operationId: listResources
      summary: List managed and retired resources
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: type
          in: query
          schema: { type: string, enum: [service, machine, router] }
        - name: label
          in: query
          description: "Keep resources with this label, as `key=value`. May be repeated; all must match."
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: phase
          in: query
          schema: { type: string, enum: [managed, retired] }
        - name: state
          in: query
          description: Type-specific state, such as `running` or `online`.
          schema: { type: string }
        - name: health
          in: query
          schema: { $ref: "#/components/schemas/Health" }
      responses:
        "200":
          description: Resources ordered by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Resources]
      operationId: createResource
      summary: Create a resource
      requestBody: { $ref: "#/components/requestBodies/ResourceDocument" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /resource-archives:
    get:
      tags: [Resources]
      operationId: listResourceArchives
      summary: List unmanaged (archived) resources
      description: Read them with `GET /resources/@{id}`; archives are read only.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: type
          in: query
          schema: { type: string, enum: [service, machine, router] }
      responses:
        "200":
          description: Archives ordered by name, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /resources/{resource}:
    parameters:
      - $ref: "#/components/parameters/Resource"
    get:
      tags: [Resources]
      operationId: getResource
      summary: A resource with its phase, state, health, checks, actions and open operation
      responses:
        "200":
          description: The resource.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Resources]
      operationId: updateResource
      summary: Replace a resource document
      description: The name in the document must match the URL; type and adapter cannot change. `If-Match` is required.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody: { $ref: "#/components/requestBodies/ResourceDocument" }
      responses:
        "200":
          description: Saved. An unchanged document keeps its version.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /resources/{resource}/versions:
    parameters:
      - $ref: "#/components/parameters/Resource"
    get:
      tags: [Resources]
      operationId: listResourceVersions
      summary: Stored versions of a resource document
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Versions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceVersionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /resources/{resource}/versions/{v}:
    parameters:
      - $ref: "#/components/parameters/Resource"
      - $ref: "#/components/parameters/Version"
    get:
      tags: [Resources]
      operationId: getResourceVersion
      summary: One stored version of a resource document
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /resources/{resource}/restore:
    post:
      tags: [Resources]
      operationId: restoreResource
      summary: Restore an old version as a new one
      parameters:
        - $ref: "#/components/parameters/Resource"
        - name: If-Match
          in: header
          required: false
          description: The current version; the current one is used when omitted.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The resource at its new current version.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /resources/{resource}/phase:
    post:
      tags: [Resources]
      operationId: setResourcePhase
      summary: Retire, resume or unmanage a resource
      description: |
        `retired` stops observation and control and keeps the records (a running
        service is stopped first when its runtime can); `managed` resumes;
        `unmanaged` archives the resource and releases its name. Unmanaging requires a
        retired resource that no config source owns and, for a service, no running
        action and a registered, stopped or failed state. Retiring a service other managed
        resources depend on or are controlled through needs `acknowledgeImpact`
        (409 `impact_unacknowledged` otherwise; see `GET /resources/{resource}/impact`).
      parameters:
        - $ref: "#/components/parameters/Resource"
        - name: If-Match
          in: header
          required: false
          description: The current version, when the body does not carry it.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourcePhaseRequest" }
      responses:
        "200":
          description: The resource in its new phase.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /resources/{resource}/actions/{action}:
    post:
      tags: [Actions]
      operationId: runResourceAction
      summary: Run a service lifecycle action
      description: |
        Starts the action in the background and answers 202 with an action id.
        Preconditions that can be checked up front (unknown resource, a type other
        than service (409 `unsupported`), wrong state, missing configuration, busy
        resource) fail synchronously. A disruptive action (stop, restart, deploy,
        rollback, run-job) on a service other managed resources depend on or are
        controlled through needs `acknowledgeImpact: true` in the body; without it the
        answer is 409 `impact_unacknowledged` with the impact in `error.details.impact`.
        With `dryRun=true` nothing is started and the plan, including the impact, is
        returned.
      parameters:
        - $ref: "#/components/parameters/Resource"
        - name: action
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ActionName" }
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: The plan (only with `dryRun=true`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionPlan" }
        "202":
          description: Started.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionStarted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /resources/{resource}/impact:
    get:
      tags: [Resources]
      operationId: getResourceImpact
      summary: Resources an action on this one reaches
      description: |
        Managed resources that depend on this one directly or transitively (`dependsOn`,
        `runsOn`) and the managed resources controlled through it or through one of its
        dependents (`controlPath`). Retired resources are neither observed nor controlled
        and do not count. With `action`, `acknowledgementRequired` tells whether that
        action needs `acknowledgeImpact`: disruptive and destructive actions and
        operations, and retiring a service, when the impact is not empty.
      parameters:
        - $ref: "#/components/parameters/Resource"
        - name: action
          in: query
          description: An action, operation or phase change of the resource's type (see `GET /resource-types`).
          schema: { type: string }
      responses:
        "200":
          description: The impact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceImpact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /resource-groups/actions:
    post:
      tags: [Actions]
      operationId: runResourceGroupAction
      summary: Run one service action on a group of services
      description: |
        Selects the managed services matching every label of the selector and runs the
        action on them one after another: the services a service depends on first,
        except for `stop`, which stops dependents first. Only service lifecycle actions
        run in groups; machine and router operations are refused. Nothing starts unless
        every step can run as planned and, when a step's impact needs it,
        `acknowledgeImpact` is set. The group stops at the first failed step; the steps
        after it are reported as `notRun`. With `dryRun` the ordered plan is returned.
        Every step is also a tracked action under `/actions/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceGroupActionRequest" }
      responses:
        "200":
          description: The plan (only with `dryRun`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceGroupPlan" }
        "202":
          description: Started.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceGroupAction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /resource-groups/actions/{id}:
    get:
      tags: [Actions]
      operationId: getResourceGroupAction
      summary: State of a group action
      description: Group actions are kept in memory; the most recent 100 are available until restart.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The group action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceGroupAction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /resources/{resource}/deployments:
    get:
      tags: [Actions]
      operationId: listDeployments
      summary: Deployment history of a service
      parameters:
        - $ref: "#/components/parameters/Resource"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Deployments of the resource's name, newest first; empty for other types.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /resources/{resource}/timeline:
    get:
      tags: [Resources]
      operationId: listResourceTimeline
      summary: Timeline of one resource
      parameters:
        - $ref: "#/components/parameters/Resource"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/TimelineKinds"
        - $ref: "#/components/parameters/TimelineFrom"
        - $ref: "#/components/parameters/TimelineTo"
      responses:
        "200":
          description: Entries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /timeline:
    get:
      tags: [Resources]
      operationId: listTimeline
      summary: Timeline of all resources
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: resource
          in: query
          description: Only entries of this resource.
          schema: { type: string }
        - $ref: "#/components/parameters/TimelineKinds"
        - $ref: "#/components/parameters/TimelineFrom"
        - $ref: "#/components/parameters/TimelineTo"
      responses:
        "200":
          description: Entries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /overview:
    get:
      tags: [Resources]
      operationId: getOverview
      summary: Summary for the overview page
      description: |
        Everything the overview page shows, in one response: resource counts per
        type and health, the managed resources that need attention (most urgent
        first), a day of hourly availability per managed resource, and the headline
        numbers.
      parameters:
        - name: since
          in: query
          description: Count deployments started at or after this instant. Defaults to 24 hours ago.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /resources/{resource}/checks:
    get:
      tags: [Monitoring]
      operationId: listChecks
      summary: Current health and checks of a resource
      parameters:
        - $ref: "#/components/parameters/Resource"
      responses:
        "200":
          description: Checks; empty for a resource without checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checks" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /resources/{resource}/checks/{check}/series:
    get:
      tags: [Monitoring]
      operationId: getCheckSeries
      summary: Result history of one check
      description: Ranges up to six hours inside raw retention use raw results; anything else uses one-minute rollups.
      parameters:
        - $ref: "#/components/parameters/Resource"
        - name: check
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          description: Start of the range; one hour before `to` when omitted.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: End of the range (exclusive); now when omitted.
          schema: { type: string, format: date-time }
        - name: points
          in: query
          description: Maximum number of points.
          schema: { type: integer, minimum: 1, maximum: 2000, default: 120 }
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /resources/{resource}/summary:
    get:
      tags: [Monitoring]
      operationId: getResourceSummary
      summary: Uptime and latency over a window
      parameters:
        - $ref: "#/components/parameters/Resource"
        - name: window
          in: query
          schema: { type: string, enum: [24h, 7d, 30d], default: 24h }
      responses:
        "200":
          description: Totals for the resource and per check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceSummaryStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /resources/{resource}/observe:
    post:
      tags: [Resources]
      operationId: observeResource
      summary: Observe a machine or router now
      description: Other types answer 409 `unsupported`.
      parameters:
        - $ref: "#/components/parameters/Resource"
      responses:
        "200":
          description: The resource after the observation.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /resources/{resource}/history:
    get:
      tags: [Resources]
      operationId: listResourceHistory
      summary: Stored observations of a machine or router
      parameters:
        - $ref: "#/components/parameters/Resource"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: resolution
          in: query
          schema: { type: string, enum: [raw, minute], default: raw }
        - name: from
          in: query
          description: Only snapshots observed at or after this instant (the minute of a minute point). Selects the newest-first order.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Only snapshots observed before this instant. Selects the newest-first order. Must be after `from`.
          schema: { type: string, format: date-time }
        - name: step
          in: query
          description: A Go duration of at least 1s, such as `5m` or `1h`. Keeps only the newest snapshot of each interval of this length (aligned to the Unix epoch), so a long range fits in few pages. Selects the newest-first order.
          schema: { type: string, examples: [5m, 1h] }
      description: |
        Without `from`, `to` and `step` the snapshots are oldest first and
        `cursor` continues after the last ID. With any of them they are newest
        first and `cursor` continues before the last ID, so the recent end of a
        range comes first. Both orders follow the snapshot IDs, which grow
        with observation time.
      responses:
        "200":
          description: Snapshots in the order described above; at most 199 per page.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ResourceSnapshot" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /resources/{resource}/events:
    get:
      tags: [Resources]
      operationId: listResourceEvents
      summary: Stored events of a machine or router
      parameters:
        - $ref: "#/components/parameters/Resource"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: order
          in: query
          description: |
            `asc` (default): oldest first by ingestion, `cursor` continues after the
            last ID. `desc`: newest first by the time the event occurred (ties by
            ID), so events recovered after a gap sit where they happened; `cursor`
            continues before the last event.
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: from
          in: query
          description: Only events that occurred at or after this instant.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Only events that occurred before this instant. Must be after `from`.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Events in the order requested; at most 199 per page.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ResourceEvent" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /resources/{resource}/capabilities:
    get:
      tags: [Resources]
      operationId: getResourceCapabilities
      summary: Prerequisites of the durable operations of a machine or router
      parameters:
        - $ref: "#/components/parameters/Resource"
      responses:
        "200":
          description: One entry per operation.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ResourceCapability" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /resources/{resource}/maintenance:
    parameters:
      - $ref: "#/components/parameters/Resource"
    get:
      tags: [Resources]
      operationId: getResourceMaintenance
      summary: Maintenance state of the local machine
      responses:
        "200":
          description: The active maintenance, or null.
          content:
            application/json:
              schema:
                type: object
                required: [maintenance]
                properties:
                  maintenance:
                    oneOf:
                      - $ref: "#/components/schemas/MachineMaintenance"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Resources]
      operationId: enterResourceMaintenance
      summary: Enter maintenance on the local machine
      description: |
        Holds local writes without a power request; a power request enters maintenance
        itself. The request acknowledges partial workload coverage and manual recovery.
        Direct administrator requests only; policies are refused.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string }
                previewHash:
                  type: string
                  minLength: 64
                  maxLength: 64
                  description: The `hash` of the reviewed preview; entry is refused (409) when the workloads changed since.
      responses:
        "200":
          description: The active maintenance.
          content:
            application/json:
              schema:
                type: object
                required: [maintenance]
                properties:
                  maintenance: { $ref: "#/components/schemas/MachineMaintenance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /resources/{resource}/maintenance/preview:
    get:
      tags: [Resources]
      operationId: previewResourceMaintenance
      summary: Workloads affected by maintenance of the local machine
      parameters:
        - $ref: "#/components/parameters/Resource"
      responses:
        "200":
          description: Current known local workloads and partial coverage; review before entering maintenance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineMaintenancePreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /resources/{resource}/maintenance/exit:
    post:
      tags: [Resources]
      operationId: exitResourceMaintenance
      summary: Exit maintenance on the local machine
      description: |
        Needs a reason, no open operation and a verified healthy observation newer than
        the entry and any later resolution. Direct administrator requests only; policies
        are refused.
      parameters:
        - $ref: "#/components/parameters/Resource"
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "204": { description: Exited. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /resources/{resource}/operations:
    parameters:
      - $ref: "#/components/parameters/Resource"
    get:
      tags: [Resources]
      operationId: listResourceOperations
      summary: Durable operations of a machine or router
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Operations, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ResourceOperation" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    post:
      tags: [Resources]
      operationId: submitResourceOperation
      summary: Submit a durable operation such as a reboot
      description: |
        One confirmed request: `reason` and `confirm` (the resource's exact name). A
        machine power request enters maintenance itself, recording the workload
        inventory, unless maintenance is already active; a refused request leaves none
        behind. The intent is stored before anything is sent; the outcome is observed
        and an unknown one needs `resolve`. The same `idempotencyKey` with the same
        action and `If-Match` version returns the stored operation instead of sending
        again. Direct administrator requests only; policies are refused. A disruptive or
        destructive operation (reboot, graceful-shutdown) on a resource other managed
        resources depend on or are controlled through needs `acknowledgeImpact` (409
        `impact_unacknowledged` otherwise); send it again when retrying with the same
        idempotency key.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, idempotencyKey, reason, confirm]
              properties:
                action: { type: string, description: "For example `reboot` or `graceful-shutdown`; see `GET /resource-types`." }
                idempotencyKey:
                  type: string
                  description: "Chosen by the client: 1-128 letters, digits, `_`, `.`, `:` or `-`, starting with a letter or digit."
                reason: { type: string, description: "Why the operation is requested; recorded with the operation and in the audit log." }
                confirm: { type: string, description: The resource's exact name, as the operator typed it. }
                acknowledgeImpact:
                  type: boolean
                  description: Accept the impact reported by `GET /resources/{resource}/impact?action=`.
      responses:
        "202":
          description: The stored operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceOperation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /resources/{resource}/operations/{id}:
    get:
      tags: [Resources]
      operationId: getResourceOperation
      summary: One durable operation
      parameters:
        - $ref: "#/components/parameters/Resource"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceOperation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /resources/{resource}/operations/{id}/resolve:
    post:
      tags: [Resources]
      operationId: resolveResourceOperation
      summary: Settle an operation whose outcome is unknown
      description: Direct administrator requests only; policies are refused.
      parameters:
        - $ref: "#/components/parameters/Resource"
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: The resolved operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceOperation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /connections:
    get:
      tags: [Resources]
      operationId: listConnections
      summary: Host-configured connections
      description: |
        Connections come from the host's connections file (`LCM_CONNECTIONS_FILE`) and
        cannot be changed through the API. Addresses, usernames and passwords are never
        returned.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Connections in file order.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /policies:
    get:
      tags: [Policies]
      operationId: listPolicies
      summary: List policies
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: resource
          in: query
          required: false
          description: >-
            Keep only deployed policies that concern this resource (by name or `@id`) and
            report how in `relation`.
          schema: { type: string }
      responses:
        "200":
          description: Policies ordered by name, deployed or not.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /policies/{p}:
    parameters:
      - $ref: "#/components/parameters/Policy"
    get:
      tags: [Policies]
      operationId: getPolicy
      summary: A policy with its triggers and compile warnings
      description: Returns the deployed version, or the latest stored one when the policy is not deployed.
      responses:
        "200":
          description: The policy.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Policies]
      operationId: deployPolicy
      summary: Validate, store and deploy a policy
      description: |
        Creates the policy (no `If-Match`, or `*`) or deploys a new version of an
        existing one (`If-Match: <current version>`). Modules are resolved from the
        module store and embedded in the stored version. A document equal to the
        latest version creates no new version but deploys it again.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody: { $ref: "#/components/requestBodies/PolicyDocument" }
      responses:
        "200":
          description: Deployed a new or unchanged version of an existing policy.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyDetail" }
        "201":
          description: Created and deployed.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /policies/{p}/deployment:
    delete:
      tags: [Policies]
      operationId: undeployPolicy
      summary: Undeploy a policy
      description: New events are no longer accepted and queued runs are cancelled; active runs finish. Stored versions are kept.
      parameters:
        - $ref: "#/components/parameters/Policy"
      responses:
        "204": { description: Undeployed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /policies/{p}/pause:
    post:
      tags: [Policies]
      operationId: pausePolicy
      summary: Pause a deployed policy
      description: A paused policy rejects new runs; active runs continue.
      parameters:
        - $ref: "#/components/parameters/Policy"
      responses:
        "200":
          description: Paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /policies/{p}/resume:
    post:
      tags: [Policies]
      operationId: resumePolicy
      summary: Resume a paused policy
      parameters:
        - $ref: "#/components/parameters/Policy"
      responses:
        "200":
          description: Resumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /policies/{p}/versions:
    get:
      tags: [Policies]
      operationId: listPolicyVersions
      summary: Stored versions of a policy
      parameters:
        - $ref: "#/components/parameters/Policy"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Versions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocVersionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /policies/{p}/versions/{v}:
    get:
      tags: [Policies]
      operationId: getPolicyVersion
      summary: One stored version of a policy
      parameters:
        - $ref: "#/components/parameters/Policy"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyDoc" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /policies/{p}/state:
    get:
      tags: [Policies]
      operationId: listPolicyState
      summary: Persistent state of a policy
      parameters:
        - $ref: "#/components/parameters/Policy"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Entries ordered by key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /policies/{p}/state/{key}:
    delete:
      tags: [Policies]
      operationId: deletePolicyState
      summary: Delete one state key
      parameters:
        - $ref: "#/components/parameters/Policy"
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /policies/{p}/runs:
    post:
      tags: [Runs]
      operationId: startRun
      summary: Start a run by hand
      description: |
        Starts a run of the deployed policy at the named trigger node, or at the
        policy's only `trigger.manual` node. The request body supplies the trigger
        event. A run dropped by the policy's `drop` concurrency mode answers 409 with
        the stored run's id in `details.runId`.
      parameters:
        - $ref: "#/components/parameters/Policy"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartRunRequest" }
      responses:
        "202":
          description: The run is stored and starts (or queues) in the background.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunStarted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /validate:
    post:
      tags: [Policies]
      operationId: validateDocument
      summary: Validate any single document without side effects
      description: |
        Decodes and checks a Policy, Module or Resource. Problems are a normal result
        and answer 200 with `valid: false`; only a request that cannot be read is an
        error. Policies are compiled against the module store; resources are checked
        against the check types, and relation targets that do not exist yet are
        warnings.
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /modules:
    get:
      tags: [Modules]
      operationId: listModules
      summary: List modules
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Modules ordered by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /modules/{m}:
    parameters:
      - $ref: "#/components/parameters/Module"
    get:
      tags: [Modules]
      operationId: getModule
      summary: A module document
      responses:
        "200":
          description: The module.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleDoc" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Modules]
      operationId: saveModule
      summary: Create or update a module
      description: |
        Creates the module (no `If-Match`, or `*`) or saves a new version of an
        existing one (`If-Match: <current version>`). Deployed policies keep the
        version of the module they were compiled with until they are deployed again.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody: { $ref: "#/components/requestBodies/ModuleDocument" }
      responses:
        "200":
          description: Saved.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleDoc" }
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleDoc" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /modules/{m}/versions:
    get:
      tags: [Modules]
      operationId: listModuleVersions
      summary: Stored versions of a module
      parameters:
        - $ref: "#/components/parameters/Module"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Versions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocVersionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /node-types:
    get:
      tags: [Policies]
      operationId: listNodeTypes
      summary: Schemas of all node types
      description: The source of truth for node palettes, property forms and ports.
      responses:
        "200":
          description: Node types sorted by type.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/NodeType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /templates:
    get:
      tags: [Policies]
      operationId: listTemplates
      summary: List the built-in policy templates
      description: |
        Templates are Policy documents with `spec.params`; each entry describes
        the parameters a form needs. Trigger props cannot be expressions, so the
        parameters a trigger uses are written into it when a template is
        instantiated; all other nodes keep reading `params.*`.
      responses:
        "200":
          description: Templates sorted by id.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /templates/{t}/instantiate:
    post:
      tags: [Policies]
      operationId: instantiateTemplate
      summary: Create a policy from a template
      description: |
        Fills the template with `params` (defaults for the rest), compiles the
        result and deploys it as a new policy. With `dryRun` nothing is stored and
        the concrete document is returned for review. The named resource must exist and be a service.
      parameters:
        - { name: t, in: path, required: true, schema: { type: string }, description: Template id. }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: Name of the new policy. }
                params:
                  type: object
                  additionalProperties: true
                dryRun: { type: boolean }
      responses:
        "200":
          description: Dry run; the document that would be deployed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateInstance" }
        "201":
          description: Created and deployed.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateInstance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /apply:
    post:
      tags: [Config]
      operationId: applyDocuments
      summary: Apply Resource, Policy and Module documents
      description: |
        Applies a multi-document YAML stream (documents separated by `---`): modules
        first, then resources, then policies, whatever the order in the body. It is not
        transactional; every document gets its own result and a failing one does not
        stop the others, so the response is 200 even when documents failed. Only a
        body without any usable document is a 422.

        `dryRun=true` validates and diffs without writing anything. A resource that a
        config source owns is not applied (`skipped`) unless `force=true`; a forced
        apply leaves the resource owned, so it shows as drifted from the repository.
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
        - name: force
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "200":
          description: One result per document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /export:
    get:
      tags: [Config]
      operationId: exportDocuments
      summary: Export resources as YAML
      description: |
        Canonical YAML of existing resources as one multi-document stream, in apply
        order (modules, resources, policies) and by name within a kind. Only document
        fields are written. Applying the output back changes nothing, so it is the way
        to move resources that were created in the web UI under git.
      parameters:
        - name: kind
          in: query
          description: resource, policy or module (plural and any case are accepted). Omit for everything.
          schema: { type: string }
        - name: name
          in: query
          description: One resource of `kind`.
          schema: { type: string }
      responses:
        "200":
          description: The documents.
          content:
            application/yaml:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /config/sources:
    get:
      tags: [Config]
      operationId: listConfigSources
      summary: List config sources
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Sources ordered by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigSourceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Config]
      operationId: createConfigSource
      summary: Register a config source
      description: |
        A source is a repository location LCM pulls Resource, Policy and Module documents
        from. LCM keeps its own clone under its data directory and never touches the
        repository's working copy. The first sync starts at once when the server runs.
        The repository URL must not embed a password; use an SSH key or a git
        credential helper.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigSourceRequest" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /config/sources/{name}:
    parameters:
      - $ref: "#/components/parameters/SourceName"
    get:
      tags: [Config]
      operationId: getConfigSource
      summary: A config source
      responses:
        "200":
          description: The source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigSource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Config]
      operationId: replaceConfigSource
      summary: Replace the settings of a config source
      description: |
        Changing the repository, branch or path forgets the last commit, so the next
        sync reads everything again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigSourceRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Config]
      operationId: deleteConfigSource
      summary: Delete a config source
      description: |
        Removes the source and LCM's clone. The resources it owned keep their content
        and become managed through the web UI and API only.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /config/sources/{name}/sync:
    post:
      tags: [Config]
      operationId: syncConfigSource
      summary: Start a sync of a source now
      description: |
        Starts a sync in the background and answers 202 with the source at once;
        a sync fetches the branch and re-applies its head commit, whatever the
        interval. Read `lastSyncAt`, `lastCommit` and `lastError` from the source
        (`GET /config/sources/{name}`) once `syncing` is false. A request while a
        sync of the same source is running joins it instead of starting another.
        Documents are applied one by one under the actor `configsync:<source>`: a
        resource that was edited outside the repository (drifted) is never
        overwritten, a changed repository document for it is reported as a conflict
        (see `GET /config/ownership`, the timeline and the `configsync` alert
        signals) instead.
      parameters:
        - $ref: "#/components/parameters/SourceName"
      responses:
        "202":
          description: The sync is running or was already running.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigSource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /config/ownership:
    get:
      tags: [Config]
      operationId: listConfigOwnership
      summary: Resources managed by config sources
      description: |
        Each entry says where the resource's document comes from and whether it
        drifted (edited outside the repository), has a conflict (a commit that
        could not be applied because of that), or is orphaned (gone from the
        repository, kept in LCM). Drift is computed on each call.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: source
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Managed resources ordered by kind and name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnershipList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /config/ownership/{kind}/{name}/resolve:
    post:
      tags: [Config]
      operationId: resolveConfigOwnership
      summary: Settle a drifted or conflicting resource
      description: |
        `use: git` writes the repository document (the skipped newer one if there is a
        conflict, otherwise the last applied one) and discards the local edits. For
        a document that a source found for an existing, unowned resource with other
        content, it applies the file and the source takes ownership.
        `use: current` keeps the current content, accepts the skipped document as the
        reference and closes the conflict; the resource stays drifted (and, for an
        unowned resource, becomes owned) until the repository content equals the
        current document, then the drift clears by itself.
      parameters:
        - $ref: "#/components/parameters/OwnedKind"
        - $ref: "#/components/parameters/OwnedName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [use]
              additionalProperties: false
              properties:
                use: { type: string, enum: [git, current] }
      responses:
        "200":
          description: The resource's ownership after resolving.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ownership" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /config/ownership/{kind}/{name}:
    delete:
      tags: [Config]
      operationId: releaseConfigOwnership
      summary: Release a resource from its config source
      description: The resource keeps its content and becomes managed through the web UI and API only.
      parameters:
        - $ref: "#/components/parameters/OwnedKind"
        - $ref: "#/components/parameters/OwnedName"
      responses:
        "204": { description: Released. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs:
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List runs
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: policy
          in: query
          schema: { type: string }
        - name: status
          in: query
          description: One or more statuses, repeated or comma separated.
          schema: { type: array, items: { $ref: "#/components/schemas/RunStatus" } }
          style: form
          explode: true
      responses:
        "200":
          description: Runs, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /runs/{id}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: A run with its per-node decision trace
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /runs/{id}/cancel:
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Cancel a queued or active run
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "202":
          description: Cancellation requested; the run ends as `cancelled`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /runs/{id}/nodes/{node}/resume:
    post:
      tags: [Runs]
      operationId: resumeNode
      summary: Resume a suspended node
      description: The node's `suspendKey` from the run trace must be sent as `key`. A node id inside a module contains slashes and must be percent-encoded.
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: node
          in: path
          required: true
          description: Scoped node id.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResumeRequest" }
      responses:
        "202":
          description: Resumed; the node continues in the background.
          content:
            application/json:
              schema:
                type: object
                required: [runId, node]
                properties:
                  runId: { type: string }
                  node: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /locks:
    get:
      tags: [Locks]
      operationId: listLocks
      summary: Held locks
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Locks ordered by name.
          content:
            application/json:
