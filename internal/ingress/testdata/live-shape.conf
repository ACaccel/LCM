# Written by LCM ingress from /etc/lcm/host.json and the route options of services; do not edit.
# Change it with sudo bin/lcm host apply or through LCM; it is replaced as a whole.

map $http_upgrade $lcm_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 192.0.2.10:80;
    server_name "example.org";
    server_tokens off;
    set $lcm_service "";
    set $lcm_category "";

    location ^~ /.well-known/acme-challenge/ {
        root "/var/www/lcm-acme";
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 "https://example.org$request_uri";
    }
}

server {
    listen 192.0.2.10:443 ssl;
    server_name "example.org";
    server_tokens off;
    ssl_certificate "/etc/letsencrypt/live/example.org/fullchain.pem";
    ssl_certificate_key "/etc/letsencrypt/live/example.org/privkey.pem";
    ssl_protocols TLSv1.2 TLSv1.3;
    set $lcm_service "";
    set $lcm_category "";

    location = "/.well-known/assetlinks.json" {
        alias "/var/www/lcm-ingress/well-known/assetlinks.json";
        types { }
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The rest of /.well-known/ is reserved for the domain.
    location ^~ /.well-known/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 404;
    }

    # Service cards.
    location = "/cards/download/cards.apk" {
        set $lcm_service "cards";
        set $lcm_category "static";
        alias "/opt/cards/www/download/cards.apk";
        types { }
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://example.org" always;
    }

    location "/cards/provided-emoji/" {
        set $lcm_service "cards";
        set $lcm_category "static";
        alias "/opt/cards/www/provided-emoji/";
        try_files $uri =404;
        gzip on;
        gzip_vary on;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://example.org" always;
    }

    location "/cards/socket.io/" {
        set $lcm_service "cards";
        set $lcm_category "socket";
        include "/etc/nginx/lcm/hooks/cards/socket-*.conf";
        proxy_pass "http://127.0.0.1:3001/socket.io/";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lcm_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://example.org" always;
    }

    location "/cards/assets/" {
        set $lcm_service "cards";
        set $lcm_category "static";
        alias "/opt/cards/www/assets/";
        try_files $uri =404;
        gzip on;
        gzip_vary on;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://example.org" always;
    }

    location = "/cards/health" {
        set $lcm_service "cards";
        set $lcm_category "health";
        include "/etc/nginx/lcm/hooks/cards/health-*.conf";
        proxy_pass "http://127.0.0.1:3001/health";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://example.org" always;
    }

    location "/cards/api/" {
        set $lcm_service "cards";
        set $lcm_category "api";
        include "/etc/nginx/lcm/hooks/cards/api-*.conf";
        client_max_body_size 3m;
        proxy_pass "http://127.0.0.1:3001/api/";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path ~^/$ "/cards/";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://example.org" always;
    }

    location "/cards/" {
        set $lcm_service "cards";
        set $lcm_category "static";
        alias "/opt/cards/www/";
        try_files $uri $uri/ "/cards/index.html";
        absolute_redirect off;
        gzip on;
        gzip_vary on;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://example.org" always;
    }

    location = "/cards" {
        set $lcm_service "cards";
        set $lcm_category "static";
        absolute_redirect off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://example.org" always;
        return 308 "/cards/$is_args$args";
    }

    # Service web.
    location "/web/" {
        set $lcm_service "web";
        set $lcm_category "api";
        include "/etc/nginx/lcm/hooks/web/api-*.conf";
        proxy_pass "http://127.0.0.1:3200/";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = "/web" {
        set $lcm_service "web";
        set $lcm_category "static";
        absolute_redirect off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 308 "/web/$is_args$args";
    }

    # Service site.
    location "/_astro/" {
        set $lcm_service "site";
        set $lcm_category "static";
        root "/var/www/site/current";
        try_files $uri =404;
        gzip on;
        gzip_vary on;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location = "/en/" {
        set $lcm_service "site";
        set $lcm_category "static";
        absolute_redirect off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        return 301 "/";
    }

    location = "/en" {
        set $lcm_service "site";
        set $lcm_category "static";
        absolute_redirect off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        return 301 "/";
    }

    location "/" {
        set $lcm_service "site";
        set $lcm_category "static";
        root "/var/www/site/current";
        try_files $uri $uri/ =404;
        error_page 404 "/404.html";
        absolute_redirect off;
        gzip on;
        gzip_vary on;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
}
