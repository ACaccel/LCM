# Written by LCM ingress from /etc/lcm/host.json and the route options of services; do not edit.
# Change it with sudo bin/lcm host apply or through LCM; it is replaced as a whole.

map $http_upgrade $lcm_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 192.0.2.10:80;
    listen [2001:db8::10]:80;
    server_name "www.example.org";
    server_tokens off;
    set $lcm_service "";
    set $lcm_category "";

    location ^~ /.well-known/acme-challenge/ {
        root "/srv/acme";
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 "https://www.example.org$request_uri";
    }
}

server {
    listen 192.0.2.10:443 ssl;
    listen [2001:db8::10]:443 ssl;
    server_name "www.example.org";
    server_tokens off;
    ssl_certificate "/etc/letsencrypt/live/www.example.org/fullchain.pem";
    ssl_certificate_key "/etc/letsencrypt/live/www.example.org/privkey.pem";
    ssl_protocols TLSv1.2 TLSv1.3;
    set $lcm_service "";
    set $lcm_category "";

    location = "/.well-known/apple-app-site-association" {
        alias "/var/www/lcm-ingress/well-known/apple-app-site-association";
        types { }
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = "/.well-known/security.txt" {
        alias "/var/www/lcm-ingress/well-known/security.txt";
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The rest of /.well-known/ is reserved for the domain.
    location ^~ /.well-known/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 404;
    }

    # Service api.
    location "/api/v1/upload/" {
        set $lcm_service "api";
        set $lcm_category "upload";
        include "/etc/nginx/lcm/hooks/api/upload-*.conf";
        client_max_body_size 64m;
        proxy_pass "http://127.0.0.1:4000/upload/";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = "/api/v1/login" {
        set $lcm_service "api";
        set $lcm_category "auth";
        include "/etc/nginx/lcm/hooks/api/auth-*.conf";
        proxy_pass "http://127.0.0.1:4000/login";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = "/api/v1/old" {
        set $lcm_service "api";
        set $lcm_category "static";
        absolute_redirect off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 308 "/api/v1/new/";
    }

    location "/api/v1/" {
        set $lcm_service "api";
        set $lcm_category "api";
        include "/etc/nginx/lcm/hooks/api/api-*.conf";
        proxy_pass "http://127.0.0.1:4000/";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = "/api/v1" {
        set $lcm_service "api";
        set $lcm_category "static";
        absolute_redirect off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 308 "/api/v1/$is_args$args";
    }

    # Service docs.
    location "/" {
        set $lcm_service "docs";
        set $lcm_category "static";
        root "/srv/docs";
        try_files $uri $uri/ "/index.html";
        absolute_redirect off;
        gzip on;
        gzip_vary on;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
