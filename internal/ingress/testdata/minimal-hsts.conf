# Written by LCM ingress from /etc/lcm/host.json and the route options of services; do not edit.
# Change it with sudo bin/lcm host apply or through LCM; it is replaced as a whole.

map $http_upgrade $lcm_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    listen [::]:80;
    server_name "example.org";
    server_tokens off;
    set $lcm_service "";
    set $lcm_category "";

    location ^~ /.well-known/acme-challenge/ {
        root "/var/www/lcm-acme";
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 "https://example.org$request_uri";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name "example.org";
    server_tokens off;
    ssl_certificate "/etc/letsencrypt/live/example.org/fullchain.pem";
    ssl_certificate_key "/etc/letsencrypt/live/example.org/privkey.pem";
    ssl_protocols TLSv1.2 TLSv1.3;
    set $lcm_service "";
    set $lcm_category "";

    # The rest of /.well-known/ is reserved for the domain.
    location ^~ /.well-known/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 404;
    }

    # Service web.
    location "/web/" {
        set $lcm_service "web";
        set $lcm_category "api";
        include "/etc/nginx/lcm/hooks/web/api-*.conf";
        proxy_pass "http://127.0.0.1:3200/";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = "/web" {
        set $lcm_service "web";
        set $lcm_category "static";
        absolute_redirect off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 308 "/web/$is_args$args";
    }
}
