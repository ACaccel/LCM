# Template 1 - logic workflow (default for run.sh).
#
# Exercises policy execution edge cases with webhook + If + Module only, so it runs
# on a single machine with NO control plane (no IEEE1935_* action nodes).
#
# New spec: policies have NO `type` field; the webhook trigger subscribes to an
# event topic via `property.event_type`.
service_name: svc-logic
module:
  - name: branch-mod # reusable If subgraph: 1 input, 2 outputs (true/false)
    numInPort: 1
    numOutPort: 2
    inPort:
      - { modulePort: 0, nodeName: m-if, nodePort: 0 }
    outPort:
      - { modulePort: 0, nodeName: m-if, nodePort: 0 } # true
      - { modulePort: 1, nodeName: m-if, nodePort: 1 } # false
    node:
      - { name: m-if, type: If, property: { combinator: AND, conditions: [ { field: Value, operator: "<=", value: 10 } ] } }
    path: []
  - name: tee-mod # pure-config fan-out: both outputs bound to the same inner port,
    # so one execution reaches both module ports in one run (Module.walk marks
    # every outPort entry the taken path backs). This is what makes a two-sided
    # Compare reachable at all.
    numInPort: 1
    numOutPort: 2
    inPort:
      - { modulePort: 0, nodeName: t-pass, nodePort: 0 }
    outPort:
      - { modulePort: 0, nodeName: t-pass, nodePort: 0 }
      - { modulePort: 1, nodeName: t-pass, nodePort: 0 }
    node:
      - { name: t-pass, type: Wait, property: { seconds: 0 } }
    path: []
policy:
  - name: policy-1
    trigger:
      - name: webhook-0
        type: Webhook
        property: { event_type: metric } # dispatch key: POST /api/lcm/webhook EventType=metric
    node:
      - { name: p-if-ge, type: If, property: { combinator: AND, conditions: [ { field: Value, operator: ">=", value: 7 } ] } }
      # Two instances of one module, named for what they do. property.module is
      # what resolves them; the legacy node-name match still works and is
      # exercised by policy-legacy below.
      - { name: hot-branch, type: Module, property: { module: branch-mod } }
      - { name: cold-branch, type: Module, property: { module: branch-mod } }
      - { name: p-if-eq, type: If, property: { combinator: AND, conditions: [ { field: Value, operator: "==", value: 10 } ] } }
      - { name: p-if-le, type: If, property: { combinator: AND, conditions: [ { field: Value, operator: "<", value: 7 } ] } }
    path:
      # An empty transFormat is pass-through: the upstream payload arrives unchanged.
      # A non-empty one projects/renames fields src->dst. Both are exercised here.
      - { nodePair: [webhook-0, p-if-ge], portPair: [0, 0], transFormat: [] } # pass-through
      - { nodePair: [p-if-ge, hot-branch], portPair: [0, 0], transFormat: [] } # If true  (port 0), pass-through
      - { nodePair: [p-if-ge, p-if-eq], portPair: [1, 0], transFormat: [{ src: Value, dst: Value }] } # If false (port 1), projected
      # Both of the module's outputs are wired, which the walker used to drop:
      # it stopped at the first outPort entry naming the inner node.
      - { nodePair: [hot-branch, cold-branch], portPair: [0, 0], transFormat: [] }
      - { nodePair: [hot-branch, p-if-le], portPair: [1, 0], transFormat: [] }
  - name: policy-rejoin
    # Branch and rejoin: only one side of r-if ever runs, so the join needs
    # mode: any. The default mode: all would wait for the untaken branch forever.
    trigger:
      - name: rejoin-wh
        type: Webhook
        property: { event_type: rejoin }
    node:
      - { name: r-if, type: If, property: { combinator: AND, conditions: [ { field: Value, operator: ">=", value: 5 }, { field: Value, operator: "<", value: 100 } ] } }
      - { name: r-true, type: Wait, property: { seconds: 0 } }
      - { name: r-false, type: Wait, property: { seconds: 0 } }
      - { name: r-join, type: Merge, property: { mode: any } }
      - { name: r-http, type: HTTPRequest, property: { method: GET, url: "http://localhost:8000/api/lcm/service" } }
    path:
      - { nodePair: [rejoin-wh, r-if], portPair: [0, 0], transFormat: [] }
      - { nodePair: [r-if, r-true], portPair: [0, 0], transFormat: [] }
      - { nodePair: [r-if, r-false], portPair: [1, 0], transFormat: [] }
      - { nodePair: [r-true, r-join], portPair: [0, 0], transFormat: [] }
      - { nodePair: [r-false, r-join], portPair: [0, 1], transFormat: [] }
      - { nodePair: [r-join, r-http], portPair: [0, 0], transFormat: [] }
  - name: policy-legacy
    # No property.module: the node name still resolves the module, so configs
    # written before the property keep working unchanged.
    trigger:
      - name: legacy-wh
        type: Webhook
        property: { event_type: legacy }
    node:
      - { name: branch-mod, type: Module, property: {} }
    path:
      - { nodePair: [legacy-wh, branch-mod], portPair: [0, 0], transFormat: [] }
  - name: policy-context
    # Namespaced payloads: the trigger's cluster name still reaches the far end
    # even though every node in between contributes nothing of its own.
    #
    # The last edge then carries only c-drop. Wait is a passthrough node, so
    # that namespace is empty by construction and c-tail receives nothing --
    # which is what pruning looks like now. A carry list naming a passthrough
    # node used to forward its copy of everything upstream; it no longer does,
    # and the GUI reports such an entry as stale because the node no longer
    # appears among the available namespaces.
    trigger:
      - name: ctx-wh
        type: Webhook
        property: { event_type: context }
    node:
      - { name: c-first, type: Wait, property: { seconds: 0 } }
      - { name: c-drop, type: Wait, property: { seconds: 0 } }
      - { name: c-tail, type: Wait, property: { seconds: 0 } }
      # A qualified field names which upstream node's value is meant. c-gate
      # reads the trigger's own Value even though the flat view is whatever the
      # nearest node produced.
      - { name: c-gate, type: If, property: { combinator: AND, conditions: [ { field: ctx-wh.Value, operator: ">=", value: 5 } ] } }
    path:
      - { nodePair: [ctx-wh, c-first], portPair: [0, 0], transFormat: [] }
      - { nodePair: [c-first, c-gate], portPair: [0, 0], transFormat: [] }
      # c-gate takes its true port when ctx-wh.Value >= 5, read by name rather
      # than from the flat view.
      - { nodePair: [c-gate, c-drop], portPair: [0, 0], transFormat: [] }
      - { nodePair: [c-drop, c-tail], portPair: [0, 0], transFormat: [], carry: [c-drop] }
  - name: policy-compare
    # Compare reads a field from each of its two inputs. One event fans out
    # through tee-mod so both sides arrive in the same run; both carry the whole
    # payload, and left/right just name which field each side contributes.
    trigger:
      - name: cmp-wh
        type: Webhook
        property: { event_type: compare }
    node:
      - { name: k-tee, type: Module, property: { module: tee-mod } }
      - { name: k-measure, type: Wait, property: { seconds: 0 } }
      - { name: k-limit, type: Wait, property: { seconds: 0 } }
      - { name: k-cmp, type: Compare, property: { combinator: AND, conditions: [ { left: Value, operator: ">=", right: Threshold } ] } }
      - { name: k-over, type: Wait, property: { seconds: 0 } }
      - { name: k-under, type: Wait, property: { seconds: 0 } }
    path:
      - { nodePair: [cmp-wh, k-tee], portPair: [0, 0], transFormat: [] }
      - { nodePair: [k-tee, k-measure], portPair: [0, 0], transFormat: [] }
      - { nodePair: [k-tee, k-limit], portPair: [1, 0], transFormat: [] }
      - { nodePair: [k-measure, k-cmp], portPair: [0, 0], transFormat: [] }
      - { nodePair: [k-limit, k-cmp], portPair: [0, 1], transFormat: [] }
      - { nodePair: [k-cmp, k-over], portPair: [0, 0], transFormat: [] }
      - { nodePair: [k-cmp, k-under], portPair: [1, 0], transFormat: [] }
  - name: policy-crossrun
    # Locks the run-boundary semantics: each event is its own run and a run
    # resets the packets, so two trigger chains can never join across events.
    # Compare here must end blocked waiting for the side the current event
    # did not feed.
    trigger:
      - name: measure-wh
        type: Webhook
        property: { event_type: measure }
      - name: limit-wh
        type: Webhook
        property: { event_type: limit }
    node:
      - { name: k-measure, type: Wait, property: { seconds: 0 } }
      - { name: k-limit, type: Wait, property: { seconds: 0 } }
      - { name: k-cmp, type: Compare, property: { combinator: AND, conditions: [ { left: Value, operator: ">=", right: Threshold } ] } }
      - { name: k-over, type: Wait, property: { seconds: 0 } }
      - { name: k-under, type: Wait, property: { seconds: 0 } }
    path:
      - { nodePair: [measure-wh, k-measure], portPair: [0, 0], transFormat: [] }
      - { nodePair: [limit-wh, k-limit], portPair: [0, 0], transFormat: [] }
      - { nodePair: [k-measure, k-cmp], portPair: [0, 0], transFormat: [] }
      - { nodePair: [k-limit, k-cmp], portPair: [0, 1], transFormat: [] }
      - { nodePair: [k-cmp, k-over], portPair: [0, 0], transFormat: [] }
      - { nodePair: [k-cmp, k-under], portPair: [1, 0], transFormat: [] }
